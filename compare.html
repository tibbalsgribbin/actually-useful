<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actually Useful — Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ───────────────────────────────────────────── */
    :root {
      --cream:   #FDFBF7;    /* warm neutral background */
      --navy:    #3B1F5A;    /* deep plum — brand primary */
      --teal:    #2D7A5F;    /* sage green — links & actions */
      --teal-lt: #C8C0E8;    /* soft periwinkle */
      --gold:    #B89000;    /* amber — star ratings only */
      --muted:   #7A6890;    /* muted plum */
      --border:  #DDD4EC;    /* lavender border */
      --red:     #c94b2e;
      --green:   #2a7a5f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      background: var(--navy);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 1.25rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(253,251,247,0.65);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--cream); }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      background: var(--navy);
      padding: 2rem 2rem 2.5rem;
      text-align: center;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: rgba(253,251,247,0.65);
      font-size: 0.9rem;
    }

    /* ── Main content ────────────────────────────────────────── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Meta bar ────────────────────────────────────────────── */
    /* ── Filter bar ──────────────────────────────────────────── */
    #filter-bar {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      background: #fdfbd4;
      overflow: hidden;
    }

    #filter-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.9rem;
      background: var(--navy);
      color: var(--cream);
    }

    #filter-bar-title {
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.02em;
    }

    #filter-bar-toggle {
      background: none;
      border: none;
      color: var(--cream);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      opacity: 0.85;
    }
    #filter-bar-toggle:hover { opacity: 1; }

    #filter-bar-body {
      padding: 0.75rem 0.9rem;
    }

    .fb-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .fb-label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #351E45;
    }

    .fb-label input[type="text"],
    .fb-label input[type="number"],
    .fb-label select {
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      background: #fff;
      color: #351E45;
      min-width: 140px;
    }

    .fb-label input[type="number"] { min-width: 80px; }

    .fb-checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
      padding-bottom: 0.35rem;
    }
    .fb-checkbox input { width: 1rem; height: 1rem; cursor: pointer; }

    /* ── Meta bar ────────────────────────────────────────────── */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .meta-bar .item-count {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .meta-bar .item-count strong {
      color: var(--navy);
    }

    .search-term-badge {
      background: #C1BFFF;
      color: #351E45;
      border: 1px solid #aba8eb;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* ── Table wrapper ───────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(53,30,69,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: #FFFFFF;
    }

    thead {
      background: var(--navy);
      color: var(--cream);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { background: rgba(253,251,247,0.1); }

    thead th.sorted-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    thead th.sorted-desc::after { content: ' ▼'; font-size: 0.65rem; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #EDE8F5; }

    td {
      padding: 0.75rem 1rem;
      vertical-align: top;
    }

    /* ── Column-specific styles ──────────────────────────────── */
    .col-title {
      min-width: 220px;
      max-width: 320px;
    }

    .col-title a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
      display: block;
    }

    .col-title a:hover { text-decoration: underline; }

    .col-price { white-space: nowrap; font-weight: 600; }

    .col-ppu {
      white-space: nowrap;
    }

    .best-value {
      color: var(--green);
      font-weight: 700;
    }

    .best-value-star {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.85rem;
    }

    .col-delivery { min-width: 140px; }
    .col-rating   { white-space: nowrap; }
    .col-reviews  { white-space: nowrap; }
    .col-note     { min-width: 160px; color: var(--muted); font-style: italic; }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill-prime   { background: #C1BFFF; color: #351E45; border: 1px solid #aba8eb; }
    .pill-coupon  { background: #98DBC6; color: #1b4d3c; border: 1px solid #81C9B2; }
    .pill-return  { background: #FFA590; color: #5c2415; border: 1px solid #F28B73; }

    .stars {
      color: var(--gold);
      letter-spacing: -0.05em;
    }

    .rating-num {
      color: var(--navy);
      font-weight: 600;
    }

    .na { color: #877891; font-size: 0.8rem; }

    /* ── Empty / error state ─────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 4rem 2rem;
    }

    .state-box .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .state-box h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 0.75rem;
    }

    .state-box p {
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: translateY(1px); opacity: 0.75; }

    .btn-primary { background: var(--navy); color: var(--cream); }
    .btn-ghost   { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); margin-left: 0.75rem; }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: var(--navy);
      color: rgba(253,251,247,0.65);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.8;
    }

    footer a {
      color: rgba(253,251,247,0.65);
      text-decoration: none;
    }

    footer a:hover { color: var(--cream); }

    .footer-sep { margin: 0 0.5rem; }

    /* ── Disclaimer ──────────────────────────────────────────── */
    .affiliate-note {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <a class="nav-brand" href="index.html">Actually Useful</a>
    <ul class="nav-links">
      <li><a href="index.html#how-it-works">How it works</a></li>
      <li><a href="index.html#support">Support</a></li>
      <li><a href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">GitHub</a></li>
    </ul>
  </nav>

  <!-- Page header -->
  <div class="page-header">
    <h1>Actually Useful — Compare</h1>
    <p>Your shortlisted items, side by side.</p>
  </div>

  <!-- Main -->
  <main id="main-content">
    <!-- Populated by JS -->
  </main>

  <!-- Footer -->
  <footer>
    <div>
      <a href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">GitHub</a>
      <span class="footer-sep">·</span>
      <a id="feedback-link" href="https://forms.gle/XU8RpYM3cGFTwQQ86" target="_blank">Give feedback</a>
      <script>
        (function() {
          const ua = navigator.userAgent;
          const browser = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Other';
          const url = 'https://docs.google.com/forms/d/1AnG9frYVy7I2KUh27Re9iIJtwwqdzpa0qceFyGxZ-pE/viewform?usp=pp_url&entry.1362282898=website&entry.1312500883=' + encodeURIComponent(browser);
          document.getElementById('feedback-link').href = url;

<script>
  // ── Config ────────────────────────────────────────────────────
  const AFFILIATE_TAG = 'PLACEHOLDER-20'; // Replace before Associates launch

  const SUPABASE_URL = 'https://bnqgeguulurcrbkdpfzv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_h70-MNvomO4EpJrpXgcdjw__motBOdi';

  // ── Helpers ───────────────────────────────────────────────────
  function affiliateUrl(asin) {
    return `https://www.amazon.com/dp/${asin}?tag=${AFFILIATE_TAG}`;
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function na(val, render) {
    if (val === null || val === undefined || val === '' || val === false) {
      return '<span class="na">—</span>';
    }
    return render ? render(val) : esc(String(val));
  }

  function renderStars(rating) {
    if (!rating) return '<span class="na">—</span>';
    const r = parseFloat(rating);
    const full  = Math.floor(r);
    const half  = (r - full) >= 0.25 && (r - full) < 0.75 ? 1 : 0;
    const empty = 5 - full - half;
    const stars = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    return `<span class="stars">${stars}</span> <span class="rating-num">${r.toFixed(1)}</span>`;
  }

  function formatReviews(n) {
    if (!n && n !== 0) return '<span class="na">—</span>';
    return Number(n).toLocaleString();
  }

  // Format a delivery date string, appending time if it's today
  function formatDeliveryDate(dateStr, ts) {
    if (!dateStr) return '';
    if (!ts) return esc(dateStr);
    var d = new Date(ts);
    var now = new Date();
    var isToday = d.getFullYear() === now.getFullYear()
               && d.getMonth() === now.getMonth()
               && d.getDate() === now.getDate();
    if (isToday) {
      var hr = d.getHours();
      var min = d.getMinutes().toString().padStart(2, '0');
      var ampm = hr >= 12 ? 'pm' : 'am';
      var hr12 = hr % 12 || 12;
      return esc(dateStr) + ' by ' + hr12 + ':' + min + ' ' + ampm;
    }
    return esc(dateStr);
  }

  // Render coupon cell: two lines when we have a coupon with was-price
  function renderCouponCell(item) {
    if (item.hasCoupon) {
      var withLine = '$' + parseFloat(item.price).toFixed(2) + ' with coupon';
      var wasLine = (item.listPrice != null && !isNaN(item.listPrice) && parseFloat(item.listPrice) !== parseFloat(item.price))
        ? '<br><s style="color:#877891;font-size:0.85em;">was $' + parseFloat(item.listPrice).toFixed(2) + '</s>'
        : '';
      return '<span class="pill pill-coupon">' + withLine + wasLine + '</span>';
    }
    if (item.sns) {
      var snsStr = item.sns === 'unknown' ? 'Subscribe &amp; Save' : esc(item.sns) + ' with S&amp;S';
      return '<span class="pill pill-coupon">' + snsStr + '</span>';
    }
    if (item.savings) {
      return '<span class="pill pill-coupon">' + esc(item.savings) + '</span>';
    }
    if (item.couponPillOnly) {
      return '<span class="pill pill-coupon">Coupon — check Amazon</span>';
    }
    return '<span class="na">—</span>';
  }

  // Find all indices that share the best (lowest) PPU value, for highlighting.
  // Normalizes liquid units (ml/fl oz) to fl oz for fair comparison.
  // Round to 6dp before comparing to avoid floating-point mismatch on equal values.
  function findBestPpuIndices(items) {
    const round = v => Math.round(v * 1e6) / 1e6;
    function getNormalizedPPU(item) {
      const v = parseFloat(item.ppu);
      if (isNaN(v) || v <= 0) return null;
      // If a liquid display unit is active, normalize through that unit
      if (liquidDisplayUnit && isLiquidUnit(item.ppuUnit)) {
        const conv = convertLiquidPPU(v, item.ppuUnit, liquidDisplayUnit);
        return conv != null ? conv : v;
      }
      // Otherwise normalize all liquids to fl oz for comparison
      if (isLiquidUnit(item.ppuUnit)) {
        const conv = convertLiquidPPU(v, item.ppuUnit, 'fl oz');
        return conv != null ? conv : v;
      }
      return v;
    }
    let bestVal = Infinity;
    items.forEach(item => {
      const v = getNormalizedPPU(item);
      if (v != null) {
        const r = round(v);
        if (r < bestVal) bestVal = r;
      }
    });
    const result = new Set();
    if (bestVal === Infinity) return result;
    items.forEach((item, i) => {
      const v = getNormalizedPPU(item);
      if (v != null && round(v) === bestVal) result.add(i);
    });
    return result;
  }

  // ── Sort state ────────────────────────────────────────────────
  let sortCol = null;
  let sortDir = 'asc';

  // ── Liquid unit display state ─────────────────────────────────
  // null = as listed; 'fl oz' = normalize all liquids to fl oz; 'ml' = normalize to ml
  let liquidDisplayUnit = null;

  const LIQUID_UNITS_SET = new Set(['fl oz','ml','l','liter','liters','milliliter','milliliters','fluid ounce','fluid ounces']);

  function isLiquidUnit(u) { return u && LIQUID_UNITS_SET.has(u.toLowerCase().trim()); }

  // Convert a raw PPU value from one liquid unit to another
  function convertLiquidPPU(ppu, fromUnit, toUnit) {
    if (!ppu || !fromUnit || !toUnit) return null;
    var from = fromUnit.toLowerCase().trim();
    var to   = toUnit.toLowerCase().trim();
    if (from === to) return ppu;
    // All values normalized through fl oz
    var toFlOz = {
      'fl oz':1,'fluid ounce':1,'fluid ounces':1,
      'ml':1/29.5735,'milliliter':1/29.5735,'milliliters':1/29.5735,
      'l':33.814,'liter':33.814,'liters':33.814
    };
    if (toFlOz[from] === undefined || toFlOz[to] === undefined) return null;
    return ppu / toFlOz[from] * toFlOz[to];
  }

  // ── Filter state ──────────────────────────────────────────────
  let filterKeyword    = '';
  let filterMinReviews = 0;
  let filterRetailer   = '';   // '' = all; or a retailerKey value
  let filterHideSponsored = false;
  let filterMinPrice   = '';
  let filterMaxPrice   = '';

  let currentSearchUrl = '';

  function sortItems(items, col) {
    const sorted = [...items];
    sorted.sort((a, b) => {
      let va = a[col];
      let vb = b[col];

      // Numeric columns
      if (['price', 'ppu', 'rating', 'reviewCount'].includes(col)) {
        va = parseFloat(va) || Infinity;
        vb = parseFloat(vb) || Infinity;
        return sortDir === 'asc' ? va - vb : vb - va;
      }

      // Coupon/promo: sort by whether item has any promo (yes first on asc)
      if (col === 'coupon') {
        const haA = !!(a.hasCoupon || a.sns || a.savings || a.couponPillOnly) ? 1 : 0;
        const haB = !!(b.hasCoupon || b.sns || b.savings || b.couponPillOnly) ? 1 : 0;
        return sortDir === 'asc' ? haB - haA : haA - haB;
      }

      // Delivery: use timestamp fields for precise sort; nulls go last
      if (col === 'delivery') {
        const FAR = 9999999999999;
        const tsA = a.freeDateTs || a.fastDateTs || FAR;
        const tsB = b.freeDateTs || b.fastDateTs || FAR;
        return sortDir === 'asc' ? tsA - tsB : tsB - tsA;
      }

      // String columns
      va = (va || '').toString().toLowerCase();
      vb = (vb || '').toString().toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return sorted;
  }

  // ── Retailer display helpers ──────────────────────────────────
  const RETAILER_LABELS = {
    'whole-foods': 'Whole Foods',
    'fresh':       'Amazon Fresh',
    'pharmacy':    'Amazon Pharmacy',
    'standard':    'Amazon',
    '':            'Amazon'
  };

  function retailerLabel(key) {
    return RETAILER_LABELS[key] || key || 'Amazon';
  }

  // ── Filter helpers ────────────────────────────────────────────
  function keywordMatchesItem(item, kwRaw) {
    if (!kwRaw.trim()) return true;
    var haystack = (item.title || '').toLowerCase();
    var branches = kwRaw.split('·').map(function(s) { return s.trim(); }).filter(Boolean);
    return branches.some(function(branch) {
      var tokens = branch.split(/\s+/).filter(Boolean);
      return tokens.every(function(tok) {
        if (tok.startsWith('-') && tok.length > 1) {
          return !haystack.includes(tok.slice(1).toLowerCase());
        }
        return haystack.includes(tok.toLowerCase());
      });
    });
  }

  function applyFilters(items) {
    return items.filter(function(item) {
      if (filterHideSponsored && item.isSponsored) return false;
      if (filterRetailer && (item.retailerKey || 'standard') !== filterRetailer) return false;
      if (filterMinReviews > 0 && (parseFloat(item.reviewCount) || 0) < filterMinReviews) return false;
      if (filterKeyword && !keywordMatchesItem(item, filterKeyword)) return false;
      if (filterMinPrice !== '' && !isNaN(filterMinPrice) && (parseFloat(item.price) || 0) < parseFloat(filterMinPrice)) return false;
      if (filterMaxPrice !== '' && !isNaN(filterMaxPrice) && (parseFloat(item.price) || 0) > parseFloat(filterMaxPrice)) return false;
      return true;
    });
  }

  // ── Render filter bar ─────────────────────────────────────────
  function renderFilterBar(allItems) {
    var keys = [];
    allItems.forEach(function(r) {
      var k = r.retailerKey || 'standard';
      if (!keys.includes(k)) keys.push(k);
    });
    var hasMultiRetailer = keys.length > 1;
    var hasSponsored = allItems.some(function(r) { return r.isSponsored; });

    var retailerOptions = '';
    if (hasMultiRetailer) {
      var opts = keys.map(function(k) {
        var sel = filterRetailer === k ? ' selected' : '';
        return '<option value="' + esc(k) + '"' + sel + '>' + esc(retailerLabel(k)) + '</option>';
      }).join('');
      retailerOptions = '<label class="fb-label">Source<select id="fb-retailer"><option value="">All</option>' + opts + '</select></label>';
    }

    var sponsoredToggle = '';
    if (hasSponsored) {
      var chk = filterHideSponsored ? ' checked' : '';
      sponsoredToggle = '<label class="fb-label fb-checkbox"><input type="checkbox" id="fb-hide-sponsored"' + chk + '> Hide sponsored</label>';
    }

    var kwVal = esc(filterKeyword);
    var mrVal = filterMinReviews || '';

    var minPriceVal = filterMinPrice !== '' ? esc(String(filterMinPrice)) : '';
    var maxPriceVal = filterMaxPrice !== '' ? esc(String(filterMaxPrice)) : '';

    return '<div id="filter-bar">'
      + '<div id="filter-bar-header">'
      + '<span id="filter-bar-title">Filters</span>'
      + '<button id="filter-bar-toggle" aria-expanded="true">&#9650; Collapse</button>'
      + '</div>'
      + '<div id="filter-bar-body">'
      + '<div class="fb-row">'

  // ── Render table ──────────────────────────────────────────────
  function renderTable(items, searchTerm) {
    var bestIndices = findBestPpuIndices(items);

    // Liquid unit toggle label
    var liquidItems = items.filter(function(it) { return it.ppu && isLiquidUnit(it.ppuUnit); });
    var hasLiquidMix = liquidItems.length > 1 && liquidItems.some(function(it) { return it.ppuUnit !== liquidItems[0].ppuUnit; });
    var hasAnyLiquid = liquidItems.length > 0;

    var colDefs = [
      { key: 'title',       label: 'Product' },
      { key: 'price',       label: 'Price' },
      { key: 'ppu',         label: 'Per unit' },
      { key: 'delivery',    label: 'Delivery' },
      { key: 'rating',      label: 'Rating' },
      { key: 'reviewCount', label: 'Reviews' },
      { key: 'isPrime',     label: 'Prime' },
      { key: 'coupon',      label: 'Coupon / promo' },
      { key: 'retailerKey', label: 'Source' },
      { key: 'note',        label: 'Notes', nosort: true },
    ];

    var theadCells = colDefs.map(function(c) {
      var cls = '';
      if (sortCol === c.key) cls = sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc';
      var style = c.nosort ? ' style="cursor:default"' : '';
      return '<th data-col="' + c.key + '" class="' + cls + '"' + style + '>' + c.label + '</th>';
    }).join('');

    var rows = items.map(function(item, i) {
      var isBest = bestIndices.has(i);

      // PPU — normalize liquid units if toggle is active
      var ppuCell;
      var ppuV = parseFloat(item.ppu);
      if (isNaN(ppuV) || ppuV <= 0) {
        ppuCell = '<span class="na">—</span>';
      } else {
        var displayPPU = ppuV;
        var displayUnit = item.ppuUnit || '';
        if (liquidDisplayUnit && isLiquidUnit(item.ppuUnit)) {
          var converted = convertLiquidPPU(ppuV, item.ppuUnit, liquidDisplayUnit);
          if (converted != null) { displayPPU = converted; displayUnit = liquidDisplayUnit; }
        }
        var ppuStr = displayPPU < 0.10
          ? '$' + displayPPU.toFixed(3).replace(/0+$/, '').replace(/\.$/, '0')
          : '$' + displayPPU.toFixed(2);
        var ppuFormatted = ppuStr + (displayUnit ? ' / ' + displayUnit : '');
        ppuCell = isBest
          ? '<span class="best-value">' + ppuFormatted + '<span class="best-value-star" title="Best value">★</span></span>'

      var primeCell = item.isPrime

      var deliveryParts = [];
      if (item.freeDate) {

        deliveryParts.push('FREE: ' + formatDeliveryDate(item.freeDate, item.freeDateTs) + q);
      }
      if (item.fastDate) deliveryParts.push('Fastest: ' + formatDeliveryDate(item.fastDate, item.fastDateTs));
      var deliveryCell = deliveryParts.length ? deliveryParts.join('<br>') : '<span class="na">—</span>';

      var priceCell = (item.price != null && !isNaN(item.price))
        ? '$' + parseFloat(item.price).toFixed(2)

      var sourceKey = item.retailerKey || 'standard';

  function attachFilterHandlers() {
    // Collapse/expand toggle
    const toggle = document.getElementById('filter-bar-toggle');
    const body   = document.getElementById('filter-bar-body');
    if (toggle && body) {
      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        toggle.textContent = expanded ? '▼ Expand' : '▲ Collapse';
        body.style.display = expanded ? 'none' : '';
      });
    }

    // Keyword — 250ms debounce, table-only rerender to preserve focus
    let kwTimer = null;
    const kwInput = document.getElementById('fb-keyword');
    if (kwInput) {
      kwInput.addEventListener('input', () => {
        clearTimeout(kwTimer);
        kwTimer = setTimeout(() => {
          filterKeyword = kwInput.value;
          rerenderTableOnly();
        }, 250);
      });
    }

    // Min reviews
    const mrInput = document.getElementById('fb-min-reviews');
    if (mrInput) {
      mrInput.addEventListener('change', () => {
        filterMinReviews = parseInt(mrInput.value, 10) || 0;
        rerender();
      });
    }

    // Min price
    const minPriceInput = document.getElementById('fb-min-price');
    if (minPriceInput) {
      minPriceInput.addEventListener('change', () => {
        filterMinPrice = minPriceInput.value.trim();

      });

  let currentSearchTerm = '';

  // ── Supabase: save comparison ─────────────────────────────────
  async function saveComparison(items, searchTerm) {
    const payload = JSON.stringify({ items, searchTerm });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ data: payload })
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const rows = await res.json();
    return rows[0].id;
  }

  // ── Supabase: load comparison ─────────────────────────────────
  async function loadComparison(id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons?id=eq.${encodeURIComponent(id)}&select=data`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!res.ok) throw new Error('Load failed: ' + res.status);
    const rows = await res.json();
    if (!rows || rows.length === 0) throw new Error('Not found');
    return JSON.parse(rows[0].data);
  }

  // ── Share button ──────────────────────────────────────────────
  function renderShareButton(label) {
    return `<button class="btn btn-ghost share-btn" id="${label}-share-btn">Share this comparison</button>`;
  }

  function attachShareHandler(btnId) {
    const btn = document.getElementById(btnId);
    if (!btn || btn.dataset.shareAttached) return;
    btn.dataset.shareAttached = '1';
    btn.addEventListener('click', async () => {
      btn.textContent = 'Saving…';
      try {
        // Only save to Supabase once — reuse the id if already in the URL
        let shareUrl;
        const existing = new URLSearchParams(window.location.search).get('id');
        if (existing) {
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', existing);
        } else {
          const id = await saveComparison(currentItems, currentSearchTerm);
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', id);
          window.history.replaceState(null, '', shareUrl.toString());
        }
        await navigator.clipboard.writeText(shareUrl.toString());
        // Update all share buttons — reset after 2.5s
        document.querySelectorAll('.share-btn').forEach(b => {
          b.textContent = 'Link copied!';
          b.disabled = false;
          setTimeout(() => { b.textContent = 'Share this comparison'; }, 2500);
        });
      } catch (e) {
        btn.textContent = 'Share failed — try again';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Share this comparison'; }, 2500);
      }
    });
  }

  // ── Bootstrap ─────────────────────────────────────────────────
  async function init() {
    const main = document.getElementById('main-content');
    const params = new URLSearchParams(window.location.search);
    const shareId = params.get('id');
    const raw = params.get('data');

    // Load from Supabase if ?id= is present
    if (shareId) {
      main.innerHTML = '<p style="text-align:center;padding:3rem;color:#877891;">Loading comparison…</p>';
      try {
        const parsed = await loadComparison(shareId);
        currentItems = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
        currentSearchUrl = parsed.searchUrl || '';
      } catch (e) {
        main.innerHTML = renderError('load-failed');
        return;
      }
      if (!currentItems.length) { main.innerHTML = renderError('load-failed'); return; }
      rerender();
      return;
    }

    // Fallback: decode ?data= for old shared links
    if (!raw) {
      main.innerHTML = renderError();
      return;
    }

    let items;
    try {
      const json = atob(decodeURIComponent(raw));
      const parsed = JSON.parse(json);
      // Accept either a bare array or { items, searchTerm }
      if (Array.isArray(parsed)) {
        items = parsed;
      } else {
        items = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
        currentSearchUrl = parsed.searchUrl || '';
      }
    } catch (e) {
      main.innerHTML = renderError('load-failed');
      return;
    }

    if (!items || items.length === 0) {
      main.innerHTML = renderError('load-failed');
      return;
    }

    currentItems = items;
    rerender();
  }

  init();
</script>
</body>
</html>
