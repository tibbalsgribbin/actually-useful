<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actually Useful — Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ───────────────────────────────────────────── */
    :root {
      --cream:   #faf7f2;
      --navy:    #1a2640;
      --teal:    #2a7f7f;
      --teal-lt: #e8f4f4;
      --gold:    #c9a84c;
      --muted:   #6b7280;
      --border:  #ddd8ce;
      --red:     #c0392b;
      --green:   #27ae60;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      background: var(--navy);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 1.25rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(250,247,242,0.75);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--cream); }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      background: var(--navy);
      padding: 2rem 2rem 2.5rem;
      text-align: center;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: rgba(250,247,242,0.65);
      font-size: 0.9rem;
    }

    /* ── Main content ────────────────────────────────────────── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Meta bar ────────────────────────────────────────────── */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .meta-bar .item-count {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .meta-bar .item-count strong {
      color: var(--navy);
    }

    .search-term-badge {
      background: var(--teal-lt);
      color: var(--teal);
      border: 1px solid var(--teal);
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* ── Table wrapper ───────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(26,38,64,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: #fff;
    }

    thead {
      background: var(--navy);
      color: var(--cream);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { background: rgba(255,255,255,0.08); }

    thead th.sorted-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    thead th.sorted-desc::after { content: ' ▼'; font-size: 0.65rem; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fdfaf6; }

    td {
      padding: 0.75rem 1rem;
      vertical-align: top;
    }

    /* ── Column-specific styles ──────────────────────────────── */
    .col-title {
      min-width: 220px;
      max-width: 320px;
    }

    .col-title a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
      display: block;
    }

    .col-title a:hover { text-decoration: underline; }

    .col-price { white-space: nowrap; font-weight: 600; }

    .col-ppu {
      white-space: nowrap;
    }

    .best-value {
      color: var(--gold);
      font-weight: 700;
    }

    .best-value-star {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.85rem;
    }

    .col-delivery { min-width: 140px; }
    .col-rating   { white-space: nowrap; }
    .col-reviews  { white-space: nowrap; }
    .col-note     { min-width: 160px; color: var(--muted); font-style: italic; }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill-prime   { background: #e8f0fe; color: #1a56db; }
    .pill-coupon  { background: #fef9e7; color: #b7791f; border: 1px solid #f6e05e; }
    .pill-return  { background: #f0fdf4; color: #166534; }

    .stars {
      color: var(--gold);
      letter-spacing: -0.05em;
    }

    .rating-num {
      color: var(--navy);
      font-weight: 600;
    }

    .na { color: #bbb; font-size: 0.8rem; }

    /* ── Empty / error state ─────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 4rem 2rem;
    }

    .state-box .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .state-box h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 0.75rem;
    }

    .state-box p {
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: translateY(1px); opacity: 0.75; }

    .btn-primary { background: var(--teal); color: #fff; }
    .btn-ghost   { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); margin-left: 0.75rem; }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: var(--navy);
      color: rgba(250,247,242,0.55);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.8;
    }

    footer a {
      color: rgba(250,247,242,0.7);
      text-decoration: none;
    }

    footer a:hover { color: var(--cream); }

    .footer-sep { margin: 0 0.5rem; }

    /* ── Disclaimer ──────────────────────────────────────────── */
    .affiliate-note {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <a class="nav-brand" href="index.html">Actually Useful</a>
    <ul class="nav-links">
      <li><a href="index.html#how-it-works">How it works</a></li>
      <li><a href="index.html#support">Support</a></li>
      <li><a href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">GitHub</a></li>
    </ul>
  </nav>

  <!-- Page header -->
  <div class="page-header">
    <h1>Actually Useful — Compare</h1>
    <p>Your shortlisted items, side by side.</p>
  </div>

  <!-- Main -->
  <main id="main-content">
    <!-- Populated by JS -->
  </main>

  <!-- Footer -->
  <footer>
    <div>
      <a href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">GitHub</a>
      <span class="footer-sep">·</span>
      <a href="https://forms.gle/J3AECVTDHWKDZZKE7" target="_blank">Give feedback</a>
      <span class="footer-sep">·</span>
      <a href="https://ko-fi.com/butactuallyuseful" target="_blank">Ko-fi</a>
    </div>
    <div style="margin-top:0.4rem;">Actually Useful: Amazon but better.</div>
  </footer>

<script>
  // ── Config ────────────────────────────────────────────────────
  const AFFILIATE_TAG = 'PLACEHOLDER-20'; // Replace before Associates launch

  const SUPABASE_URL = 'https://bnqgeguulurcrbkdpfzv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_h70-MNvomO4EpJrpXgcdjw__motBOdi';

  // ── Helpers ───────────────────────────────────────────────────
  function affiliateUrl(asin) {
    return `https://www.amazon.com/dp/${asin}?tag=${AFFILIATE_TAG}`;
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function na(val, render) {
    if (val === null || val === undefined || val === '' || val === false) {
      return '<span class="na">—</span>';
    }
    return render ? render(val) : esc(String(val));
  }

  function renderStars(rating) {
    if (!rating) return '<span class="na">—</span>';
    const r = parseFloat(rating);
    const full  = Math.floor(r);
    const half  = (r - full) >= 0.25 && (r - full) < 0.75 ? 1 : 0;
    const empty = 5 - full - half;
    const stars = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    return `<span class="stars">${stars}</span> <span class="rating-num">${r.toFixed(1)}</span>`;
  }

  function formatReviews(n) {
    if (!n && n !== 0) return '<span class="na">—</span>';
    return Number(n).toLocaleString();
  }

  // Find all indices that share the best (lowest) PPU value, for highlighting.
  // Round to 6dp before comparing to avoid floating-point mismatch on equal values.
  function findBestPpuIndices(items) {
    const round = v => Math.round(v * 1e6) / 1e6;
    let bestVal = Infinity;
    items.forEach(item => {
      const v = parseFloat(item.ppu);
      if (!isNaN(v) && v > 0) {
        const r = round(v);
        if (r < bestVal) bestVal = r;
      }
    });
    const result = new Set();
    if (bestVal === Infinity) return result;
    items.forEach((item, i) => {
      const v = parseFloat(item.ppu);
      if (!isNaN(v) && round(v) === bestVal) result.add(i);
    });
    return result;
  }

  // ── Sort state ────────────────────────────────────────────────
  let sortCol = null;
  let sortDir = 'asc';

  function sortItems(items, col) {
    const sorted = [...items];
    sorted.sort((a, b) => {
      let va = a[col];
      let vb = b[col];

      // Numeric columns
      if (['price', 'ppu', 'rating', 'reviewCount'].includes(col)) {
        va = parseFloat(va) || Infinity;
        vb = parseFloat(vb) || Infinity;
        return sortDir === 'asc' ? va - vb : vb - va;
      }

      // String columns
      va = (va || '').toString().toLowerCase();
      vb = (vb || '').toString().toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return sorted;
  }

  // ── Render table ──────────────────────────────────────────────
  function renderTable(items, searchTerm) {
    const bestIndices = findBestPpuIndices(items);

    const colDefs = [
      { key: 'title',       label: 'Product' },
      { key: 'price',       label: 'Price' },
      { key: 'ppu',         label: 'Per unit' },
      { key: 'delivery',    label: 'Delivery' },
      { key: 'rating',      label: 'Rating' },
      { key: 'reviewCount', label: 'Reviews' },
      { key: 'prime',       label: 'Prime' },
      { key: 'coupon',      label: 'Coupon / promo' },
      { key: 'soldBy',      label: 'Sold by' },
      { key: 'shipsFrom',   label: 'Ships from' },
      { key: 'returnPolicy',label: 'Returns' },
      { key: 'note',        label: 'Your note' },
    ];

    const theadCells = colDefs.map(c => {
      let cls = '';
      if (sortCol === c.key) cls = sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc';
      return `<th data-col="${c.key}" class="${cls}">${c.label}</th>`;
    }).join('');

    const rows = items.map((item, i) => {
      const isBest = bestIndices.has(i);

      const ppuCell = (() => {
        const v = parseFloat(item.ppu);
        if (isNaN(v) || v <= 0) return '<span class="na">—</span>';
        const ppuStr = v < 0.10 ? '$'+v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'0') : '$'+v.toFixed(2);
        const formatted = `${ppuStr}${item.ppuUnit ? ' / ' + item.ppuUnit : ''}`;
        if (isBest) return `<span class="best-value">${formatted}<span class="best-value-star" title="Best value">★</span></span>`;
        return formatted;
      })();

      const primeCell = item.prime
        ? '<span class="pill pill-prime">Prime</span>'
        : '<span class="na">—</span>';

      const couponCell = item.coupon
        ? `<span class="pill pill-coupon">${esc(item.coupon)}</span>`
        : '<span class="na">—</span>';

      const returnCell = item.returnPolicy
        ? `<span class="pill pill-return">${esc(item.returnPolicy)}</span>`
        : '<span class="na">—</span>';

      const priceCell = (item.price != null && !isNaN(item.price))
        ? `$${parseFloat(item.price).toFixed(2)}`
        : '<span class="na">—</span>';

      return `<tr>
        <td class="col-title"><a href="${affiliateUrl(item.asin)}" target="_blank" rel="noopener">${esc(item.title)}</a></td>
        <td class="col-price">${priceCell}</td>
        <td class="col-ppu">${ppuCell}</td>
        <td class="col-delivery">${na(item.delivery)}</td>
        <td class="col-rating">${renderStars(item.rating)}</td>
        <td class="col-reviews">${formatReviews(item.reviewCount)}</td>
        <td>${primeCell}</td>
        <td>${couponCell}</td>
        <td>${na(item.soldBy)}</td>
        <td>${na(item.shipsFrom)}</td>
        <td>${returnCell}</td>
        <td class="col-note">${na(item.note)}</td>
      </tr>`;
    }).join('');

    const termBadge = searchTerm
      ? `<span class="search-term-badge">${esc(searchTerm)}</span>`
      : '';

    return `
      <div class="meta-bar">
        <span class="item-count">Comparing <strong>${items.length}</strong> item${items.length !== 1 ? 's' : ''}</span>
        ${termBadge}
        ${renderShareButton('top')}
      </div>
      <div class="table-wrapper">
        <table id="compare-table">
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="affiliate-note">As an Amazon Associate I earn from qualifying purchases. Links on this page support Actually Useful — and don't cost you anything extra.</p>
      <div style="text-align:center;margin-top:1rem;">${renderShareButton('bottom')}</div>
    `;
  }

  // ── Error state ───────────────────────────────────────────────
  function renderError() {
    return `
      <div class="state-box">
        <div class="icon">🛒</div>
        <h2>Nothing to compare yet</h2>
        <p>This page shows your shortlisted Amazon items side by side. To use it, install the Actually Useful extension, shortlist some items while searching on Amazon, and click <strong>Compare side by side</strong>.</p>
        <a class="btn btn-primary" href="index.html">Learn more</a>
        <a class="btn btn-ghost" href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">Get the extension</a>
      </div>
    `;
  }

  // ── Column sort handler ───────────────────────────────────────
  let currentItems = [];

  function attachSortHandlers() {
    document.querySelectorAll('#compare-table thead th').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortCol = col;
          sortDir = 'asc';
        }
        const sorted = sortItems(currentItems, sortCol);
        document.getElementById('main-content').innerHTML = renderTable(sorted, currentSearchTerm);
        attachSortHandlers();
        attachShareHandler('top-share-btn');
        attachShareHandler('bottom-share-btn');
      });
    });
  }

  let currentSearchTerm = '';

  // ── Supabase: save comparison ─────────────────────────────────
  async function saveComparison(items, searchTerm) {
    const payload = JSON.stringify({ items, searchTerm });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ data: payload })
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const rows = await res.json();
    return rows[0].id;
  }

  // ── Supabase: load comparison ─────────────────────────────────
  async function loadComparison(id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons?id=eq.${encodeURIComponent(id)}&select=data`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!res.ok) throw new Error('Load failed: ' + res.status);
    const rows = await res.json();
    if (!rows || rows.length === 0) throw new Error('Not found');
    return JSON.parse(rows[0].data);
  }

  // ── Share button ──────────────────────────────────────────────
  function renderShareButton(label) {
    return `<button class="btn btn-ghost share-btn" id="${label}-share-btn">Share this comparison</button>`;
  }

  function attachShareHandler(btnId) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.addEventListener('click', async () => {
      btn.textContent = 'Saving…';
      try {
        // Only save to Supabase once — reuse the id if already in the URL
        let shareUrl;
        const existing = new URLSearchParams(window.location.search).get('id');
        if (existing) {
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', existing);
        } else {
          const id = await saveComparison(currentItems, currentSearchTerm);
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', id);
          window.history.replaceState(null, '', shareUrl.toString());
        }
        await navigator.clipboard.writeText(shareUrl.toString());
        // Update all share buttons — reset after 2.5s
        document.querySelectorAll('.share-btn').forEach(b => {
          b.textContent = 'Link copied!';
          b.disabled = false;
          setTimeout(() => { b.textContent = 'Share this comparison'; }, 2500);
        });
      } catch (e) {
        btn.textContent = 'Share failed — try again';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Share this comparison'; }, 2500);
      }
    });
  }

  // ── Bootstrap ─────────────────────────────────────────────────
  async function init() {
    const main = document.getElementById('main-content');
    const params = new URLSearchParams(window.location.search);
    const shareId = params.get('id');
    const raw = params.get('data');

    // Load from Supabase if ?id= is present
    if (shareId) {
      main.innerHTML = '<p style="text-align:center;padding:3rem;color:#6b7280;">Loading comparison…</p>';
      try {
        const parsed = await loadComparison(shareId);
        currentItems = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
      } catch (e) {
        main.innerHTML = renderError();
        return;
      }
      if (!currentItems.length) { main.innerHTML = renderError(); return; }
      main.innerHTML = renderTable(currentItems, currentSearchTerm);
      attachSortHandlers();
      attachShareHandler('top-share-btn');
      attachShareHandler('bottom-share-btn');
      return;
    }

    // Otherwise decode ?data= as before
    if (!raw) {
      main.innerHTML = renderError();
      return;
    }

    let items;
    try {
      const json = atob(decodeURIComponent(raw));
      const parsed = JSON.parse(json);
      // Accept either a bare array or { items, searchTerm }
      if (Array.isArray(parsed)) {
        items = parsed;
      } else {
        items = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
      }
    } catch (e) {
      main.innerHTML = renderError();
      return;
    }

    if (!items || items.length === 0) {
      main.innerHTML = renderError();
      return;
    }

    currentItems = items;
    main.innerHTML = renderTable(items, currentSearchTerm);
    attachSortHandlers();
    attachShareHandler('top-share-btn');
    attachShareHandler('bottom-share-btn');
  }

  init();
</script>
</body>
</html>
