<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actually Useful — Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ───────────────────────────────────────────── */
    :root {
      --cream:   #FDFBD4;
      --navy:    #CF6DFC;
      --teal:    #912c9e;
      --teal-lt: #C1BFFF;
      --gold:    #BDB96A;
      --muted:   #877891;
      --border:  #EAE6B6;
      --red:     #c94b2e;
      --green:   #2a7a5f;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      background: var(--navy);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 1.25rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(53,30,69,0.75);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--cream); filter: brightness(0.85); }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      background: var(--navy);
      padding: 2rem 2rem 2.5rem;
      text-align: center;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      color: #351E45;
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: rgba(53,30,69,0.75);
      font-size: 0.9rem;
    }

    /* ── Main content ────────────────────────────────────────── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Meta bar ────────────────────────────────────────────── */
    /* ── Filter bar ──────────────────────────────────────────── */
    #filter-bar {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      background: #fdfbd4;
      overflow: hidden;
    }

    #filter-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.9rem;
      background: #CF6DFC;
      color: #fff;
    }

    #filter-bar-title {
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.02em;
    }

    #filter-bar-toggle {
      background: none;
      border: none;
      color: #fff;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      opacity: 0.85;
    }
    #filter-bar-toggle:hover { opacity: 1; }

    #filter-bar-body {
      padding: 0.75rem 0.9rem;
    }

    .fb-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .fb-label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #351E45;
    }

    .fb-label input[type="text"],
    .fb-label input[type="number"],
    .fb-label select {
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      background: #fff;
      color: #351E45;
      min-width: 140px;
    }

    .fb-label input[type="number"] { min-width: 80px; }

    .fb-checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
      padding-bottom: 0.35rem;
    }
    .fb-checkbox input { width: 1rem; height: 1rem; cursor: pointer; }

    /* ── Meta bar ────────────────────────────────────────────── */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .meta-bar .item-count {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .meta-bar .item-count strong {
      color: var(--navy);
    }

    .search-term-badge {
      background: #C1BFFF;
      color: #351E45;
      border: 1px solid #aba8eb;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* ── Table wrapper ───────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(53,30,69,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: #FFFFFF;
    }

    thead {
      background: var(--navy);
      color: #351E45;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { background: rgba(53,30,69,0.1); }

    thead th.sorted-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    thead th.sorted-desc::after { content: ' ▼'; font-size: 0.65rem; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fcfadb; }

    td {
      padding: 0.75rem 1rem;
      vertical-align: top;
    }

    /* ── Column-specific styles ──────────────────────────────── */
    .col-title {
      min-width: 220px;
      max-width: 320px;
    }

    .col-title a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
      display: block;
    }

    .col-title a:hover { text-decoration: underline; }

    .col-price { white-space: nowrap; font-weight: 600; }

    .col-ppu {
      white-space: nowrap;
    }

    .best-value {
      color: var(--gold);
      font-weight: 700;
    }

    .best-value-star {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.85rem;
    }

    .col-delivery { min-width: 140px; }
    .col-rating   { white-space: nowrap; }
    .col-reviews  { white-space: nowrap; }
    .col-note     { min-width: 160px; color: var(--muted); font-style: italic; }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .pill-prime   { background: #C1BFFF; color: #351E45; border: 1px solid #aba8eb; }
    .pill-coupon  { background: #98DBC6; color: #1b4d3c; border: 1px solid #81C9B2; }
    .pill-return  { background: #FFA590; color: #5c2415; border: 1px solid #F28B73; }

    .stars {
      color: var(--gold);
      letter-spacing: -0.05em;
    }

    .rating-num {
      color: var(--navy);
      font-weight: 600;
    }

    .na { color: #877891; font-size: 0.8rem; }

    /* ── Empty / error state ─────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 4rem 2rem;
    }

    .state-box .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .state-box h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 0.75rem;
    }

    .state-box p {
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: translateY(1px); opacity: 0.75; }

    .btn-primary { background: var(--navy); color: #351E45; }
    .btn-ghost   { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); margin-left: 0.75rem; }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: #BDB96A;
      color: rgba(53,30,69,0.85);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.8;
    }

    footer a {
      color: rgba(53,30,69,0.85);
      text-decoration: none;
    }

    footer a:hover { color: #351E45; }

    .footer-sep { margin: 0 0.5rem; }

    /* ── Disclaimer ──────────────────────────────────────────── */
    .affiliate-note {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Nav -->
  <nav>
    <a class="nav-brand" href="index.html">Actually Useful</a>
    <ul class="nav-links">
      <li><a href="index.html#how-it-works">How it works</a></li>
      <li><a href="index.html#support">Support</a></li>
      <li><a href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">GitHub</a></li>
    </ul>
  </nav>

  <!-- Page header -->
  <div class="page-header">
    <h1>Actually Useful — Compare</h1>
    <p>Your shortlisted items, side by side.</p>
  </div>

  <!-- Main -->
  <main id="main-content">
    <!-- Populated by JS -->
  </main>

  <!-- Footer -->
  <footer>
    <div>
      <a href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">GitHub</a>
      <span class="footer-sep">·</span>
      <a id="feedback-link" href="https://forms.gle/XU8RpYM3cGFTwQQ86" target="_blank">Give feedback</a>
      <script>
        (function() {
          const ua = navigator.userAgent;
          const browser = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Other';
          const url = 'https://docs.google.com/forms/d/1AnG9frYVy7I2KUh27Re9iIJtwwqdzpa0qceFyGxZ-pE/viewform?usp=pp_url&entry.1362282898=website&entry.1312500883=' + encodeURIComponent(browser);
          document.getElementById('feedback-link').href = url;
        })();
      </script>
      <span class="footer-sep">·</span>
      <a href="https://ko-fi.com/butactuallyuseful" target="_blank">Ko-fi</a>
    </div>
    <div style="margin-top:0.4rem;">Actually Useful: Amazon but better.</div>
  </footer>

<script>
  // ── Config ────────────────────────────────────────────────────
  const AFFILIATE_TAG = 'PLACEHOLDER-20'; // Replace before Associates launch

  const SUPABASE_URL = 'https://bnqgeguulurcrbkdpfzv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_h70-MNvomO4EpJrpXgcdjw__motBOdi';

  // ── Helpers ───────────────────────────────────────────────────
  function affiliateUrl(asin) {
    return `https://www.amazon.com/dp/${asin}?tag=${AFFILIATE_TAG}`;
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function na(val, render) {
    if (val === null || val === undefined || val === '' || val === false) {
      return '<span class="na">—</span>';
    }
    return render ? render(val) : esc(String(val));
  }

  function renderStars(rating) {
    if (!rating) return '<span class="na">—</span>';
    const r = parseFloat(rating);
    const full  = Math.floor(r);
    const half  = (r - full) >= 0.25 && (r - full) < 0.75 ? 1 : 0;
    const empty = 5 - full - half;
    const stars = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    return `<span class="stars">${stars}</span> <span class="rating-num">${r.toFixed(1)}</span>`;
  }

  function formatReviews(n) {
    if (!n && n !== 0) return '<span class="na">—</span>';
    return Number(n).toLocaleString();
  }

  // Find all indices that share the best (lowest) PPU value, for highlighting.
  // Round to 6dp before comparing to avoid floating-point mismatch on equal values.
  function findBestPpuIndices(items) {
    const round = v => Math.round(v * 1e6) / 1e6;
    let bestVal = Infinity;
    items.forEach(item => {
      const v = parseFloat(item.ppu);
      if (!isNaN(v) && v > 0) {
        const r = round(v);
        if (r < bestVal) bestVal = r;
      }
    });
    const result = new Set();
    if (bestVal === Infinity) return result;
    items.forEach((item, i) => {
      const v = parseFloat(item.ppu);
      if (!isNaN(v) && round(v) === bestVal) result.add(i);
    });
    return result;
  }

  // ── Sort state ────────────────────────────────────────────────
  let sortCol = null;
  let sortDir = 'asc';

  // ── Filter state ──────────────────────────────────────────────
  let filterKeyword    = '';
  let filterMinReviews = 0;
  let filterRetailer   = '';   // '' = all; or a retailerKey value
  let filterHideSponsored = false;

  function sortItems(items, col) {
    const sorted = [...items];
    sorted.sort((a, b) => {
      let va = a[col];
      let vb = b[col];

      // Numeric columns
      if (['price', 'ppu', 'rating', 'reviewCount'].includes(col)) {
        va = parseFloat(va) || Infinity;
        vb = parseFloat(vb) || Infinity;
        return sortDir === 'asc' ? va - vb : vb - va;
      }

      // String columns
      va = (va || '').toString().toLowerCase();
      vb = (vb || '').toString().toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return sorted;
  }

  // ── Retailer display helpers ──────────────────────────────────
  const RETAILER_LABELS = {
    'whole-foods': 'Whole Foods',
    'fresh':       'Amazon Fresh',
    'pharmacy':    'Amazon Pharmacy',
    'standard':    'Amazon',
    '':            'Amazon'
  };

  function retailerLabel(key) {
    return RETAILER_LABELS[key] || key || 'Amazon';
  }

  // ── Filter helpers ────────────────────────────────────────────
  function keywordMatchesItem(item, kwRaw) {
    if (!kwRaw.trim()) return true;
    const haystack = (item.title || '').toLowerCase();
    const branches = kwRaw.split('·').map(s => s.trim()).filter(Boolean);
    return branches.some(branch => {
      const tokens = branch.split(/\s+/).filter(Boolean);
      return tokens.every(tok => {
        if (tok.startsWith('-') && tok.length > 1) {
          return !haystack.includes(tok.slice(1).toLowerCase());
        }
        return haystack.includes(tok.toLowerCase());
      });
    });
  }

  function applyFilters(items) {
    return items.filter(item => {
      if (filterHideSponsored && item.isSponsored) return false;
      if (filterRetailer && (item.retailerKey || 'standard') !== filterRetailer) return false;
      if (filterMinReviews > 0 && (parseFloat(item.reviewCount) || 0) < filterMinReviews) return false;
      if (filterKeyword && !keywordMatchesItem(item, filterKeyword)) return false;
      return true;
    });
  }

  // ── Render filter bar ─────────────────────────────────────────
  function renderFilterBar(allItems) {
    const keys = [...new Set(allItems.map(r => r.retailerKey || 'standard'))];
    const hasMultiRetailer = keys.length > 1;
    const hasSponsored = allItems.some(r => r.isSponsored);

    const retailerOptions = hasMultiRetailer
      ? `<label class="fb-label">Source
          <select id="fb-retailer">
            <option value="">All</option>
            ${keys.map(k => `<option value="${k}"${filterRetailer===k?' selected':''}>${esc(retailerLabel(k))}</option>`).join('')}
          </select>
        </label>`
      : '';

    const sponsoredToggle = hasSponsored
      ? `<label class="fb-label fb-checkbox">
          <input type="checkbox" id="fb-hide-sponsored"${filterHideSponsored?' checked':''}> Hide sponsored
        </label>`
      : '';

    return `<div id="filter-bar">
      <div id="filter-bar-header">
        <span id="filter-bar-title">Filters</span>
        <button id="filter-bar-toggle" aria-expanded="true">▲ Collapse</button>
      </div>
      <div id="filter-bar-body">
        <div class="fb-row">
          <label class="fb-label">Keyword
            <input type="text" id="fb-keyword" placeholder="e.g. unscented -refill" value="${esc(filterKeyword)}">
          </label>
          <label class="fb-label">Min reviews
            <input type="number" id="fb-min-reviews" min="0" placeholder="0" value="${filterMinReviews||''}">
          </label>
          ${retailerOptions}
          ${sponsoredToggle}
          <button id="fb-clear" class="btn btn-ghost">Clear filters</button>
        </div>
      </div>
    </div>`;
  }

  // ── Render table ──────────────────────────────────────────────
  function renderTable(items, searchTerm) {
    const bestIndices = findBestPpuIndices(items);

    const colDefs = [
      { key: 'title',       label: 'Product' },
      { key: 'price',       label: 'Price' },
      { key: 'ppu',         label: 'Per unit' },
      { key: 'delivery',    label: 'Delivery' },
      { key: 'rating',      label: 'Rating' },
      { key: 'reviewCount', label: 'Reviews' },
      { key: 'isPrime',     label: 'Prime' },
      { key: 'coupon',      label: 'Coupon / promo' },
      { key: 'retailerKey', label: 'Source' },
    ];

    const theadCells = colDefs.map(c => {
      let cls = '';
      if (sortCol === c.key) cls = sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc';
      return `<th data-col="${c.key}" class="${cls}">${c.label}</th>`;
    }).join('');

    const rows = items.map((item, i) => {
      const isBest = bestIndices.has(i);

      const ppuCell = (() => {
        const v = parseFloat(item.ppu);
        if (isNaN(v) || v <= 0) return '<span class="na">—</span>';
        const ppuStr = v < 0.10 ? '$'+v.toFixed(3).replace(/0+$/,'').replace(/\.$/,'0') : '$'+v.toFixed(2);
        const formatted = `${ppuStr}${item.ppuUnit ? ' / ' + item.ppuUnit : ''}`;
        if (isBest) return `<span class="best-value">${formatted}<span class="best-value-star" title="Best value">★</span></span>`;
        return formatted;
      })();

      const primeCell = item.isPrime
        ? '<span class="pill pill-prime">Prime</span>'
        : '<span class="na">—</span>';

      const couponCell = (() => {
        if (item.hasCoupon) {
          const wasStr = (item.listPrice && !isNaN(item.listPrice))
            ? ` <span class="na">(was $${parseFloat(item.listPrice).toFixed(2)})</span>` : '';
          return `<span class="pill pill-coupon">Coupon${wasStr}</span>`;
        }
        if (item.sns) {
          const snsStr = item.sns === 'unknown' ? 'Subscribe &amp; Save' : esc(item.sns) + ' with S&amp;S';
          return `<span class="pill pill-coupon">${snsStr}</span>`;
        }
        if (item.savings) return `<span class="pill pill-coupon">${esc(item.savings)}</span>`;
        if (item.couponPillOnly) return '<span class="pill pill-coupon">Coupon — check Amazon</span>';
        return '<span class="na">—</span>';
      })();

      const deliveryCell = (() => {
        if (!item.freeDate && !item.fastDate) return '<span class="na">—</span>';
        let parts = [];
        if (item.freeDate) {
          const q = item.freeQualifier ? ` <span class="na">(${esc(item.freeQualifier)})</span>` : '';
          parts.push(`FREE: ${esc(item.freeDate)}${q}`);
        }
        if (item.fastDate) parts.push(`Fastest: ${esc(item.fastDate)}`);
        return parts.join('<br>');
      })();

      const priceCell = (item.price != null && !isNaN(item.price))
        ? `$${parseFloat(item.price).toFixed(2)}`
        : '<span class="na">—</span>';

      const sourceCell = (() => {
        const key = item.retailerKey || 'standard';
        const label = retailerLabel(key);
        if (key === 'standard') return '<span class="na">Amazon</span>';
        return `<span class="pill" style="background:#e8e4f8;color:#351E45;border:1px solid #c1bfff;">${esc(label)}</span>`;
      })();

      const sponsoredBadge = item.isSponsored
        ? ' <span class="pill" style="background:#f0f0f0;color:#888;border:1px solid #ddd;font-size:0.7em;">Ad</span>'
        : '';

      return `<tr>
        <td class="col-title"><a href="${affiliateUrl(item.asin)}" target="_blank" rel="noopener">${esc(item.title)}</a>${sponsoredBadge}</td>
        <td class="col-price">${priceCell}</td>
        <td class="col-ppu">${ppuCell}</td>
        <td class="col-delivery">${deliveryCell}</td>
        <td class="col-rating">${renderStars(item.rating)}</td>
        <td class="col-reviews">${formatReviews(item.reviewCount)}</td>
        <td>${primeCell}</td>
        <td>${couponCell}</td>
        <td>${sourceCell}</td>
      </tr>`;
    }).join('');

    const hiddenCount = currentItems.length - items.length;
    const hiddenNote = hiddenCount > 0
      ? `<span style="color:#877891;font-size:0.88em;">${hiddenCount} item${hiddenCount!==1?'s':'''} hidden by filters</span>`
      : '';

    const termBadge = searchTerm
      ? `<span class="search-term-badge">${esc(searchTerm)}</span>`
      : '';

    return `
      ${renderFilterBar(currentItems)}
      <div class="meta-bar">
        <span class="item-count">Comparing <strong>${items.length}</strong> item${items.length !== 1 ? 's' : ''}</span>
        ${hiddenNote}
        ${termBadge}
        ${renderShareButton('top')}
      </div>
      <div class="table-wrapper">
        <table id="compare-table">
          <thead><tr>${theadCells}</tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div style="text-align:center;margin-top:1rem;">${renderShareButton('bottom')}</div>
      <p class="affiliate-note">This post contains affiliate links. If you click through and make a purchase, I may earn a commission at no additional cost to you.</p>
    `;
  }

  // ── Error state ───────────────────────────────────────────────
  function renderError(type) {
    if (type === 'load-failed') {
      return `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <h2>Couldn't load this comparison</h2>
          <p>The link may have expired, or there was a problem reaching the server. If you still have the extension open, you can select your items again and click <strong>Compare selected items</strong> to create a new one.</p>
          <a class="btn btn-primary" href="index.html">Back to home</a>
        </div>
      `;
    }
    // Default: no data at all
    return `
      <div class="state-box">
        <div class="icon">🛒</div>
        <h2>Nothing to compare yet</h2>
        <p>This page shows your shortlisted Amazon items side by side. To use it, install the Actually Useful extension, shortlist some items while searching on Amazon, and click <strong>Compare selected items</strong>.</p>
        <a class="btn btn-primary" href="index.html">Learn more</a>
        <a class="btn btn-ghost" href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">Get the extension</a>
      </div>
    `;
  }

  // ── Column sort handler ───────────────────────────────────────
  let currentItems = [];

  // Central re-render: applies filters then sort, then rewires handlers
  function rerender() {
    const filtered = applyFilters(currentItems);
    const sorted = (sortCol && filtered.length) ? sortItems(filtered, sortCol) : filtered;
    document.getElementById('main-content').innerHTML = renderTable(sorted, currentSearchTerm);
    attachSortHandlers();
    attachFilterHandlers();
    attachShareHandler('top-share-btn');
    attachShareHandler('bottom-share-btn');
  }

  function attachSortHandlers() {
    document.querySelectorAll('#compare-table thead th').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (sortCol === col) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortCol = col;
          sortDir = 'asc';
        }
        rerender();
      });
    });
  }

  function attachFilterHandlers() {
    // Collapse/expand toggle
    const toggle = document.getElementById('filter-bar-toggle');
    const body   = document.getElementById('filter-bar-body');
    if (toggle && body) {
      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        toggle.textContent = expanded ? '▼ Expand' : '▲ Collapse';
        body.style.display = expanded ? 'none' : '';
      });
    }

    // Keyword — 250ms debounce
    let kwTimer = null;
    const kwInput = document.getElementById('fb-keyword');
    if (kwInput) {
      kwInput.addEventListener('input', () => {
        clearTimeout(kwTimer);
        kwTimer = setTimeout(() => {
          filterKeyword = kwInput.value;
          rerender();
        }, 250);
      });
    }

    // Min reviews
    const mrInput = document.getElementById('fb-min-reviews');
    if (mrInput) {
      mrInput.addEventListener('change', () => {
        filterMinReviews = parseInt(mrInput.value, 10) || 0;
        rerender();
      });
    }

    // Retailer select
    const retSel = document.getElementById('fb-retailer');
    if (retSel) {
      retSel.addEventListener('change', () => {
        filterRetailer = retSel.value;
        rerender();
      });
    }

    // Hide sponsored toggle
    const sponChk = document.getElementById('fb-hide-sponsored');
    if (sponChk) {
      sponChk.addEventListener('change', () => {
        filterHideSponsored = sponChk.checked;
        rerender();
      });
    }

    // Clear filters
    const clearBtn = document.getElementById('fb-clear');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        filterKeyword = '';
        filterMinReviews = 0;
        filterRetailer = '';
        filterHideSponsored = false;
        sortCol = null;
        sortDir = 'asc';
        rerender();
      });
    }
  }

  let currentSearchTerm = '';

  // ── Supabase: save comparison ─────────────────────────────────
  async function saveComparison(items, searchTerm) {
    const payload = JSON.stringify({ items, searchTerm });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ data: payload })
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const rows = await res.json();
    return rows[0].id;
  }

  // ── Supabase: load comparison ─────────────────────────────────
  async function loadComparison(id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons?id=eq.${encodeURIComponent(id)}&select=data`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!res.ok) throw new Error('Load failed: ' + res.status);
    const rows = await res.json();
    if (!rows || rows.length === 0) throw new Error('Not found');
    return JSON.parse(rows[0].data);
  }

  // ── Share button ──────────────────────────────────────────────
  function renderShareButton(label) {
    return `<button class="btn btn-ghost share-btn" id="${label}-share-btn">Share this comparison</button>`;
  }

  function attachShareHandler(btnId) {
    const btn = document.getElementById(btnId);
    if (!btn || btn.dataset.shareAttached) return;
    btn.dataset.shareAttached = '1';
    btn.addEventListener('click', async () => {
      btn.textContent = 'Saving…';
      try {
        // Only save to Supabase once — reuse the id if already in the URL
        let shareUrl;
        const existing = new URLSearchParams(window.location.search).get('id');
        if (existing) {
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', existing);
        } else {
          const id = await saveComparison(currentItems, currentSearchTerm);
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', id);
          window.history.replaceState(null, '', shareUrl.toString());
        }
        await navigator.clipboard.writeText(shareUrl.toString());
        // Update all share buttons — reset after 2.5s
        document.querySelectorAll('.share-btn').forEach(b => {
          b.textContent = 'Link copied!';
          b.disabled = false;
          setTimeout(() => { b.textContent = 'Share this comparison'; }, 2500);
        });
      } catch (e) {
        btn.textContent = 'Share failed — try again';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Share this comparison'; }, 2500);
      }
    });
  }

  // ── Bootstrap ─────────────────────────────────────────────────
  async function init() {
    const main = document.getElementById('main-content');
    const params = new URLSearchParams(window.location.search);
    const shareId = params.get('id');
    const raw = params.get('data');

    // Load from Supabase if ?id= is present
    if (shareId) {
      main.innerHTML = '<p style="text-align:center;padding:3rem;color:#877891;">Loading comparison…</p>';
      try {
        const parsed = await loadComparison(shareId);
        currentItems = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
      } catch (e) {
        main.innerHTML = renderError('load-failed');
        return;
      }
      if (!currentItems.length) { main.innerHTML = renderError('load-failed'); return; }
      rerender();
      return;
    }

    // Fallback: decode ?data= for old shared links
    if (!raw) {
      main.innerHTML = renderError();
      return;
    }

    let items;
    try {
      const json = atob(decodeURIComponent(raw));
      const parsed = JSON.parse(json);
      // Accept either a bare array or { items, searchTerm }
      if (Array.isArray(parsed)) {
        items = parsed;
      } else {
        items = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
      }
    } catch (e) {
      main.innerHTML = renderError('load-failed');
      return;
    }

    if (!items || items.length === 0) {
      main.innerHTML = renderError('load-failed');
      return;
    }

    currentItems = items;
    rerender();
  }

  init();
</script>
</body>
</html>
