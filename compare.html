<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actually Useful — Compare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Variables ───────────────────────────────────────────── */
    :root {
      --cream:   #eaecfd;    /* 10 — lightest indigo, background */
      --navy:    #512bd3;    /* 1  — deep indigo, headers & nav */
      --teal:    #5d49da;    /* 2  — medium indigo, links & buttons */
      --teal-lt: #c2c5f7;    /* 8  — light indigo, pills */
      --gold:    #BDB96A;    /* gold — star ratings */
      --muted:   #6B5FA0;    /* muted indigo */
      --border:  #afb2f4;    /* 7  — indigo border */
      --red:     #c94b2e;
      --green:   #D4920A;    /* amber — best value */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: #1A1035;
      min-height: 100vh;
    }

    /* ── Nav ─────────────────────────────────────────────────── */
    nav {
      background: var(--navy);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }

    .nav-brand {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 1.25rem;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--cream); }

    /* ── Page header ─────────────────────────────────────────── */
    .page-header {
      background: var(--navy);
      padding: 2rem 2rem 2.5rem;
      text-align: center;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      color: var(--cream);
      font-size: 2rem;
      font-weight: 400;
      margin-bottom: 0.4rem;
    }

    .page-header p {
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
    }

    /* ── Main content ────────────────────────────────────────── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* ── Meta bar ────────────────────────────────────────────── */
    /* ── Filter bar ──────────────────────────────────────────── */
    #filter-bar {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 1rem;
      background: #eaecfd;
      overflow: hidden;
    }

    #filter-bar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.9rem;
      background: var(--navy);
      color: var(--cream);
    }

    #filter-bar-title {
      font-weight: 400;
      font-size: 0.875rem;
      letter-spacing: 0.02em;
    }

    #filter-bar-toggle {
      background: none;
      border: none;
      color: var(--cream);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      opacity: 0.85;
    }
    #filter-bar-toggle:hover { opacity: 1; }

    #filter-bar-body {
      padding: 0.75rem 0.9rem;
    }

    .fb-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .fb-label {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      font-size: 0.78rem;
      font-weight: 400;
      color: #1A1035;
    }

    .fb-label input[type="text"],
    .fb-label input[type="number"],
    .fb-label select {
      padding: 0.3rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
      background: #fff;
      color: #1A1035;
      min-width: 140px;
    }

    .fb-label input[type="text"]   { min-width: 220px; }
    .fb-label input[type="number"] { width: 80px; min-width: 0; }

    /* ── Action bar (appears when rows are checked) ───────────── */
    #action-bar {
      display: none;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 0.6rem 1rem;
      background: #512bd3;
      color: #FDFBF7;
      border-radius: 8px;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
    }
    #action-bar.visible { display: flex; }
    #action-bar .action-count { flex: 1; font-weight: 400; }
    #action-bar .btn-action {
      background: #6b60e0; color: #ffffff; border: none;
      padding: 0.35rem 0.85rem; border-radius: 4px; cursor: pointer;
      font-size: 0.82rem; font-weight: 400; font-family: inherit;
      white-space: nowrap;
    }
    #action-bar .btn-action:hover { background: #5d49da; }
    #action-bar .btn-action-ghost {
      background: transparent; color: #FDFBF7;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 0.35rem 0.85rem; border-radius: 4px; cursor: pointer;
      font-size: 0.82rem; font-weight: 400; font-family: inherit;
      white-space: nowrap;
    }
    #action-bar .btn-action-ghost:hover { background: rgba(255,255,255,0.1); }

    /* ── Row checkbox column ─────────────────────────────────── */
    .col-cb { width: 32px; padding: 0.75rem 0.5rem; text-align: center; }
    .col-cb input[type="checkbox"] { width: 1rem; height: 1rem; cursor: pointer; accent-color: #6b60e0; }
    thead .col-cb input[type="checkbox"] { accent-color: #6b60e0; }

    /* ── Thumbnail ───────────────────────────────────────────── */
    .col-thumb { width: 64px; padding: 0.5rem; }
    .col-thumb img { width: 56px; height: 56px; object-fit: contain; border-radius: 4px; display: block; }

    /* ── Editable note textarea ──────────────────────────────── */
    .note-textarea {
      width: 100%; min-height: 40px; resize: vertical;
      border: 1px solid #afb2f4; border-radius: 4px;
      padding: 4px 6px; font-size: 0.8rem; font-family: inherit;
      color: #1A1035; background: #fff; box-sizing: border-box;
    }
    .note-textarea:focus { outline: none; border-color: #6b60e0; }

    .fb-checkbox {
      flex-direction: row;
      align-items: center;
      gap: 0.4rem;
      padding-bottom: 0.35rem;
    }
    .fb-checkbox input { width: 1rem; height: 1rem; cursor: pointer; }

    /* ── Meta bar ────────────────────────────────────────────── */
    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .meta-bar .item-count {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .meta-bar .item-count strong {
      color: var(--navy);
    }

    .search-term-badge {
      background: #C1BFFF;
      color: #1A1035;
      border: 1px solid #aba8eb;
      border-radius: 4px;
      padding: 0.2rem 0.6rem;
      font-size: 0.8rem;
      font-weight: 400;
    }

    /* ── Table wrapper ───────────────────────────────────────── */
    .table-wrapper {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(26,16,53,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
      background: #FFFFFF;
    }

    thead {
      background: var(--navy);
      color: var(--cream);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    thead th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 400;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    thead th:hover { background: rgba(255,255,255,0.1); }

    thead th.sorted-asc::after  { content: ' ▲'; font-size: 0.65rem; }
    thead th.sorted-desc::after { content: ' ▼'; font-size: 0.65rem; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #d6d8fa; }

    td {
      padding: 0.75rem 1rem;
      vertical-align: top;
    }

    /* ── Column-specific styles ──────────────────────────────── */
    .col-title {
      min-width: 220px;
      max-width: 320px;
    }

    .col-title a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.4;
      display: block;
    }

    .col-title a:hover { text-decoration: underline; }

    .col-price { white-space: nowrap; font-weight: 400; }

    .col-ppu {
      white-space: nowrap;
    }

    .best-value {
      color: var(--green);
      font-weight: 500;
    }

    .best-value-star {
      display: inline-block;
      margin-left: 0.25rem;
      font-size: 0.85rem;
    }

    .col-delivery { min-width: 140px; }
    .col-rating   { white-space: nowrap; }
    .col-reviews  { white-space: nowrap; }
    .col-note     { min-width: 160px; color: var(--muted); font-style: italic; }

    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 400;
      white-space: nowrap;
    }

    .pill-prime   { background: #C1BFFF; color: #1A1035; border: 1px solid #aba8eb; }
    .pill-coupon  { background: #c2c5f7; color: #1A1035; border: 1px solid #9d9eef; }
    .pill-return  { background: #FFA590; color: #5c2415; border: 1px solid #F28B73; }

    .stars {
      color: var(--gold);
      letter-spacing: -0.05em;
    }

    .rating-num {
      color: var(--navy);
      font-weight: 400;
    }

    .na { color: #877891; font-size: 0.8rem; }

    /* ── Empty / error state ─────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 4rem 2rem;
    }

    .state-box .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .state-box h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: var(--navy);
      margin-bottom: 0.75rem;
    }

    .state-box p {
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      font-size: 0.875rem;
      text-decoration: none;
      transition: opacity 0.15s;
      cursor: pointer;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { transform: translateY(1px); opacity: 0.75; }

    .btn-primary { background: var(--navy); color: #ffffff; }
    .btn-ghost   { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); margin-left: 0.75rem; }

    /* ── Footer ──────────────────────────────────────────────── */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.75);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      line-height: 1.8;
    }

    footer a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
    }

    footer a:hover { color: #ffffff; }

    .footer-sep { margin: 0 0.5rem; }

    /* ── Disclaimer ──────────────────────────────────────────── */
    .affiliate-note {
      margin-top: 1.25rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<script>
  // ── Config ────────────────────────────────────────────────────
  const AFFILIATE_TAG = 'PLACEHOLDER-20'; // Replace before Associates launch

  const SUPABASE_URL = 'https://bnqgeguulurcrbkdpfzv.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_h70-MNvomO4EpJrpXgcdjw__motBOdi';

  // ── Helpers ───────────────────────────────────────────────────
  function affiliateUrl(asin) {
    return `https://www.amazon.com/dp/${asin}?tag=${AFFILIATE_TAG}`;
  }

  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function na(val, render) {
    if (val === null || val === undefined || val === '' || val === false) {
      return '<span class="na">—</span>';
    }
    return render ? render(val) : esc(String(val));
  }

  function renderStars(rating) {
    if (!rating) return '<span class="na">—</span>';
    const r = parseFloat(rating);
    const full  = Math.floor(r);
    const half  = (r - full) >= 0.25 && (r - full) < 0.75 ? 1 : 0;
    const empty = 5 - full - half;
    const stars = '★'.repeat(full) + (half ? '½' : '') + '☆'.repeat(empty);
    return `<span class="stars">${stars}</span> <span class="rating-num">${r.toFixed(1)}</span>`;
  }

  function formatReviews(n) {
    if (!n && n !== 0) return '<span class="na">—</span>';
    return Number(n).toLocaleString();
  }

  // Format a delivery date string, appending time window if available
  function formatDeliveryDate(dateStr, ts, windowMinutes, windowEnd) {
    if (!dateStr) return '';
    if (windowMinutes != null) {
      var h = Math.floor(windowMinutes / 60);
      var meridiem = h < 12 ? 'AM' : 'PM';
      var h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
      var startStr = h12 + ' ' + meridiem;
      if (windowEnd != null) {
        var he = Math.floor(windowEnd / 60);
        var meridiemE = he < 12 ? 'AM' : 'PM';
        var h12e = he === 0 ? 12 : he > 12 ? he - 12 : he;
        return esc(dateStr) + ', ' + startStr + '–' + h12e + ' ' + meridiemE;
      }
      return esc(dateStr) + ', by ' + startStr;
    }
    return esc(dateStr);
  }

  // Render coupon cell: label only — price info is already in the Price column
  function renderCouponCell(item) {
    if (item.hasCoupon) {
      return '<span class="pill pill-coupon">Coupon</span>';
    }
    if (item.sns) {
      var snsStr = item.sns === 'unknown' ? 'Subscribe &amp; Save' : esc(item.sns) + ' with S&amp;S';
      return '<span class="pill pill-coupon">' + snsStr + '</span>';
    }
    if (item.savings) {
      return '<span class="pill pill-coupon">' + esc(item.savings) + '</span>';
    }
    if (item.couponPillOnly) {
      return '<span class="pill pill-coupon">Check Amazon</span>';
    }
    return '<span class="na">—</span>';
  }

  // Find all indices that share the best (lowest) PPU value, for highlighting.
  // Normalizes liquid units (ml/fl oz) to fl oz for fair comparison.
  // Round to 6dp before comparing to avoid floating-point mismatch on equal values.
  function findBestPpuIndices(items) {
    const round = v => Math.round(v * 1e6) / 1e6;
    function getNormalizedPPU(item) {
      const v = parseFloat(item.ppu);
      if (isNaN(v) || v <= 0) return null;
      // If a liquid display unit is active, normalize through that unit
      if (liquidDisplayUnit && isLiquidUnit(item.ppuUnit)) {
        const conv = convertLiquidPPU(v, item.ppuUnit, liquidDisplayUnit);
        return conv != null ? conv : v;
      }
      // Otherwise normalize all liquids to fl oz for comparison
      if (isLiquidUnit(item.ppuUnit)) {
        const conv = convertLiquidPPU(v, item.ppuUnit, 'fl oz');
        return conv != null ? conv : v;
      }
      return v;
    }
    let bestVal = Infinity;
    items.forEach(item => {
      const v = getNormalizedPPU(item);
      if (v != null) {
        const r = round(v);
        if (r < bestVal) bestVal = r;
      }
    });
    const result = new Set();
    if (bestVal === Infinity) return result;
    items.forEach((item, i) => {
      const v = getNormalizedPPU(item);
      if (v != null && round(v) === bestVal) result.add(i);
    });
    return result;
  }

  // ── Sort state ────────────────────────────────────────────────
  let sortCol = null;
  let sortDir = 'asc';

  // ── Liquid unit display state ─────────────────────────────────
  // null = as listed; 'fl oz' = normalize all liquids to fl oz; 'ml' = normalize to ml
  let liquidDisplayUnit = null;

  const LIQUID_UNITS_SET = new Set(['fl oz','ml','l','liter','liters','milliliter','milliliters','fluid ounce','fluid ounces']);

  function isLiquidUnit(u) { return u && LIQUID_UNITS_SET.has(u.toLowerCase().trim()); }

  // Convert a raw PPU value from one liquid unit to another
  function convertLiquidPPU(ppu, fromUnit, toUnit) {
    if (!ppu || !fromUnit || !toUnit) return null;
    var from = fromUnit.toLowerCase().trim();
    var to   = toUnit.toLowerCase().trim();
    if (from === to) return ppu;
    // All values normalized through fl oz
    var toFlOz = {
      'fl oz':1,'fluid ounce':1,'fluid ounces':1,
      'ml':1/29.5735,'milliliter':1/29.5735,'milliliters':1/29.5735,
      'l':33.814,'liter':33.814,'liters':33.814
    };
    if (toFlOz[from] === undefined || toFlOz[to] === undefined) return null;
    return ppu / toFlOz[from] * toFlOz[to];
  }

  // ── Filter state ──────────────────────────────────────────────
  let filterInclude    = '';  // include terms; supports OR with | or ·
  let filterExclude    = '';  // exclude terms (space-separated)
  let filterMinReviews = 0;
  let filterMinRating  = 0;
  let filterRetailer   = '';   // '' = all; or a retailerKey value
  let filterHideSponsored = false;
  let filterMinPrice   = '';
  let filterMaxPrice   = '';
  let filterRequirePrime = false;

  let currentSearchUrl = '';

  // ── Column visibility state ───────────────────────────────────
  // Keys match colDefs keys; true = visible. Checkbox/_thumb/title always visible (not here).
  var colVisible = {
    price:       true,
    ppu:         true,
    delivery:    true,
    rating:      true,
    reviewCount: true,
    isPrime:     true,
    coupon:      true,
    retailerKey: true,
    note:        true
  };

  var COL_LABELS = {
    price:       'Price',
    ppu:         'Per unit',
    delivery:    'Delivery',
    rating:      'Rating',
    reviewCount: 'Reviews',
    isPrime:     'Prime',
    coupon:      'Coupon / promo',
    retailerKey: 'Source',
    note:        'Notes'
  };

  function sortItems(items, col) {
    const sorted = [...items];
    sorted.sort((a, b) => {
      let va = a[col];
      let vb = b[col];

      // Numeric columns
      if (['price', 'ppu', 'rating', 'reviewCount'].includes(col)) {
        va = parseFloat(va) || Infinity;
        vb = parseFloat(vb) || Infinity;
        return sortDir === 'asc' ? va - vb : vb - va;
      }

      // Coupon/promo: sort by whether item has any promo (yes first on asc)
      if (col === 'coupon') {
        const haA = !!(a.hasCoupon || a.sns || a.savings || a.couponPillOnly) ? 1 : 0;
        const haB = !!(b.hasCoupon || b.sns || b.savings || b.couponPillOnly) ? 1 : 0;
        return sortDir === 'asc' ? haB - haA : haA - haB;
      }

      // Delivery: use timestamp fields for precise sort; nulls go last
      if (col === 'delivery') {
        const FAR = 9999999999999;
        const tsA = a.freeDateTs || a.fastDateTs || FAR;
        const tsB = b.freeDateTs || b.fastDateTs || FAR;
        return sortDir === 'asc' ? tsA - tsB : tsB - tsA;
      }

      // Notes: checked items first, then alphabetical by note text
      if (col === 'note') {
        const cbA = checkedAsins[a.asin] ? 1 : 0;
        const cbB = checkedAsins[b.asin] ? 1 : 0;
        if (cbA !== cbB) return sortDir === 'asc' ? cbB - cbA : cbA - cbB;
        va = (a.note || '').toLowerCase();
        vb = (b.note || '').toLowerCase();
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ? 1 : -1;
        return 0;
      }

      // String columns
      va = (va || '').toString().toLowerCase();
      vb = (vb || '').toString().toLowerCase();
      if (va < vb) return sortDir === 'asc' ? -1 : 1;
      if (va > vb) return sortDir === 'asc' ? 1 : -1;
      return 0;
    });
    return sorted;
  }

  // ── Retailer display helpers ──────────────────────────────────
  const RETAILER_LABELS = {
    'whole-foods': 'Whole Foods',
    'fresh':       'Amazon Fresh',
    'pharmacy':    'Amazon Pharmacy',
    'standard':    'Amazon',
    '':            'Amazon'
  };

  function retailerLabel(key) {
    return RETAILER_LABELS[key] || key || 'Amazon';
  }

  // ── Filter helpers ────────────────────────────────────────────
  // Include filter: supports OR branches via | or · separator
  // Each branch is a set of space-separated terms that must ALL appear (AND within branch)
  function includeMatchesItem(item, raw) {
    if (!raw.trim()) return true;
    var haystack = (item.title || '').toLowerCase();
    var branches = raw.split(/\bOR\b|[|·]/).map(function(s) { return s.trim(); }).filter(Boolean);
    return branches.some(function(branch) {
      var tokens = branch.split(/\s+/).filter(Boolean);
      return tokens.every(function(tok) {
        return haystack.includes(tok.toLowerCase());
      });
    });
  }

  // Exclude filter: space-separated terms — item is hidden if ANY term matches
  function excludeMatchesItem(item, raw) {
    if (!raw.trim()) return false;
    var haystack = (item.title || '').toLowerCase();
    var tokens = raw.split(/\s+/).filter(Boolean);
    return tokens.some(function(tok) {
      return haystack.includes(tok.toLowerCase());
    });
  }

  function applyFilters(items) {
    return items.filter(function(item) {
      if (showCheckedOnly && !checkedAsins[item.asin]) return false;
      if (filterHideSponsored && item.isSponsored) return false;
      if (filterRequirePrime && !item.isPrime) return false;
      if (filterRetailer && (item.retailerKey || 'standard') !== filterRetailer) return false;
      if (filterMinReviews > 0 && (parseFloat(item.reviewCount) || 0) < filterMinReviews) return false;
      if (filterMinRating > 0 && (parseFloat(item.rating) || 0) < filterMinRating) return false;
      if (filterInclude && !includeMatchesItem(item, filterInclude)) return false;
      if (filterExclude && excludeMatchesItem(item, filterExclude)) return false;
      if (filterMinPrice !== '' && !isNaN(filterMinPrice) && (parseFloat(item.price) || 0) < parseFloat(filterMinPrice)) return false;
      if (filterMaxPrice !== '' && !isNaN(filterMaxPrice) && (parseFloat(item.price) || 0) > parseFloat(filterMaxPrice)) return false;
      return true;
    });
  }

  // ── Render filter bar ─────────────────────────────────────────
  function renderFilterBar(allItems) {
    var keys = [];
    allItems.forEach(function(r) {
      var k = r.retailerKey || 'standard';
      if (!keys.includes(k)) keys.push(k);
    });
    var hasMultiRetailer = keys.length > 1;
    var hasSponsored = allItems.some(function(r) { return r.isSponsored; });

    var retailerOptions = '';
    if (hasMultiRetailer) {
      var opts = keys.map(function(k) {
        var sel = filterRetailer === k ? ' selected' : '';
        return '<option value="' + esc(k) + '"' + sel + '>' + esc(retailerLabel(k)) + '</option>';
      }).join('');
      retailerOptions = '<label class="fb-label">Source<select id="fb-retailer"><option value="">All</option>' + opts + '</select></label>';
    }

    var sponsoredToggle = '';
    if (hasSponsored) {
      var chk = filterHideSponsored ? ' checked' : '';
      sponsoredToggle = '<label class="fb-label fb-checkbox"><input type="checkbox" id="fb-hide-sponsored"' + chk + '> Hide sponsored</label>';
    }

    var primeChk = filterRequirePrime ? ' checked' : '';
    var primeToggle = '<label class="fb-label fb-checkbox"><input type="checkbox" id="fb-require-prime"' + primeChk + '> Prime only</label>';

    var inclVal = esc(filterInclude);
    var exclVal = esc(filterExclude);
    var mrVal = filterMinReviews || '';
    var ratingVal = filterMinRating || '';

    var minPriceVal = filterMinPrice !== '' ? esc(String(filterMinPrice)) : '';
    var maxPriceVal = filterMaxPrice !== '' ? esc(String(filterMaxPrice)) : '';

    return '<div id="filter-bar">'
      + '<div id="filter-bar-header">'
      + '<span id="filter-bar-title">Filters</span>'
      + '<button id="filter-bar-toggle" aria-expanded="true">&#9650; Collapse</button>'
      + '</div>'
      + '<div id="filter-bar-body">'
      + '<div class="fb-row">'
      + '<label class="fb-label">Include<span style="font-size:0.75em;color:#6B5FA0;font-weight:400;margin-left:0.3em;">(use | or OR for alternatives)</span><input type="text" id="fb-include" placeholder="e.g. unscented | fragrance free" value="' + inclVal + '" style="min-width:260px;"></label>'
      + '<label class="fb-label">Exclude<input type="text" id="fb-exclude" placeholder="e.g. refill travel" value="' + exclVal + '" style="min-width:180px;"></label>'
      + '<label class="fb-label">Minimum reviews<input type="number" id="fb-min-reviews" min="0" placeholder="0" value="' + mrVal + '"></label>'
      + '<label class="fb-label">Minimum rating<input type="number" id="fb-min-rating" min="0" max="5" step="0.1" placeholder="0" value="' + ratingVal + '"></label>'
      + '<label class="fb-label">Minimum price ($)<input type="number" id="fb-min-price" min="0" placeholder="0" value="' + minPriceVal + '"></label>'
      + '<label class="fb-label">Maximum price ($)<input type="number" id="fb-max-price" min="0" placeholder="any" value="' + maxPriceVal + '"></label>'
      + retailerOptions
      + sponsoredToggle
      + primeToggle
      + '<button id="fb-clear" class="btn btn-ghost">Clear filters</button>'
      + '</div>'
      + '</div>'
      + '</div>';
  }

  // ── Column toggle bar ─────────────────────────────────────────
  function renderColumnToggleBar() {
    var btns = Object.keys(colVisible).map(function(key) {
      var active = colVisible[key];
      var style = active
        ? 'background:#512bd3;color:#ffffff;border:1px solid #512bd3;'
        : 'background:#fff;color:#6B5FA0;border:1px solid #afb2f4;';
      return '<button class="col-toggle-btn" data-col="' + key + '" style="' + style
        + 'padding:0.2rem 0.65rem;border-radius:4px;font-size:0.78rem;cursor:pointer;font-family:inherit;white-space:nowrap;user-select:text;">'
        + COL_LABELS[key] + '</button>';
    }).join('');
    return '<div id="col-toggle-bar" style="display:flex;flex-wrap:wrap;align-items:center;gap:0.4rem;margin-bottom:0.75rem;padding:0.5rem 0.75rem;background:#eaecfd;border:1px solid #afb2f4;border-radius:6px;">'
      + '<span style="font-size:0.78rem;font-weight:600;color:#1A1035;white-space:nowrap;margin-right:0.25rem;user-select:text;cursor:text;">Show columns:</span>'
      + btns
      + '</div>';
  }

  function applyColVisibility() {
    Object.keys(colVisible).forEach(function(key) {
      var show = colVisible[key];
      // Find th by data-col
      var th = document.querySelector('#compare-table thead th[data-col="' + key + '"]');
      if (th) th.style.display = show ? '' : 'none';
      // Find all tds by col class — map key to class
      var cls = key === 'reviewCount' ? 'col-reviews'
              : key === 'isPrime'     ? null   // no dedicated class — use col index
              : key === 'coupon'      ? null
              : key === 'retailerKey' ? null
              : 'col-' + key;
      if (cls) {
        document.querySelectorAll('#compare-table tbody td.' + cls).forEach(function(td) {
          td.style.display = show ? '' : 'none';
        });
      } else {
        // Fall back to column index
        var ths = document.querySelectorAll('#compare-table thead th');
        var idx = -1;
        ths.forEach(function(t, i) { if (t.dataset.col === key) idx = i; });
        if (idx >= 0) {
          document.querySelectorAll('#compare-table tbody tr').forEach(function(tr) {
            var td = tr.children[idx];
            if (td) td.style.display = show ? '' : 'none';
          });
        }
      }
    });
  }

  function attachColToggleHandlers() {
    document.querySelectorAll('.col-toggle-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var key = this.getAttribute('data-col');
        colVisible[key] = !colVisible[key];
        var active = colVisible[key];
        this.style.background = active ? '#512bd3' : '#fff';
        this.style.color      = active ? '#ffffff' : '#6B5FA0';
        this.style.border     = active ? '1px solid #512bd3' : '1px solid #afb2f4';
        applyColVisibility();
      });
    });
  }

  // ── Render table ──────────────────────────────────────────────
  function renderTable(items, searchTerm) {
    var bestIndices = findBestPpuIndices(items);

    // Liquid unit toggle label
    var liquidItems = items.filter(function(it) { return it.ppu && isLiquidUnit(it.ppuUnit); });
    var hasLiquidMix = liquidItems.length > 1 && liquidItems.some(function(it) { return it.ppuUnit !== liquidItems[0].ppuUnit; });
    var hasAnyLiquid = liquidItems.length > 0;

    var allChecked = items.length > 0 && items.every(function(it) { return checkedAsins[it.asin]; });
    var anyChecked = items.some(function(it) { return checkedAsins[it.asin]; });
    var selectAllChk = '<input type="checkbox" id="compare-select-all" title="Select all"' + (allChecked ? ' checked' : (anyChecked ? ' indeterminate-state' : '')) + '>';

    var colDefs = [
      { key: '_cb',         label: selectAllChk, nosort: true, cls: 'col-cb' },
      { key: '_thumb',      label: '',           nosort: true, cls: 'col-thumb' },
      { key: 'title',       label: 'Product' },
      { key: 'price',       label: 'Price' },
      { key: 'ppu',         label: 'Per unit' },
      { key: 'delivery',    label: 'Delivery' },
      { key: 'rating',      label: 'Rating' },
      { key: 'reviewCount', label: 'Reviews' },
      { key: 'isPrime',     label: 'Prime' },
      { key: 'coupon',      label: 'Coupon / promo' },
      { key: 'retailerKey', label: 'Source' },
      { key: 'note',        label: 'Notes' },
    ];

    var theadCells = colDefs.map(function(c) {
      var cls = c.cls || '';
      if (sortCol === c.key) cls += (cls ? ' ' : '') + (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      var style = c.nosort ? ' style="cursor:default"' : '';
      return '<th data-col="' + c.key + '" class="' + cls + '"' + style + '>' + c.label + '</th>';
    }).join('');

    var rows = items.map(function(item, i) {
      var isBest = bestIndices.has(i);
      var isChecked = !!checkedAsins[item.asin];
      var safeAsin = esc(item.asin);

      // PPU — normalize liquid units if toggle is active
      var ppuCell;
      var ppuV = parseFloat(item.ppu);
      if (isNaN(ppuV) || ppuV <= 0) {
        ppuCell = '<span class="na">—</span>';
      } else {
        var displayPPU = ppuV;
        var displayUnit = item.ppuUnit || '';
        if (liquidDisplayUnit && isLiquidUnit(item.ppuUnit)) {
          var converted = convertLiquidPPU(ppuV, item.ppuUnit, liquidDisplayUnit);
          if (converted != null) { displayPPU = converted; displayUnit = liquidDisplayUnit; }
        }
        var ppuStr = displayPPU < 0.10
          ? '$' + displayPPU.toFixed(3).replace(/0+$/, '').replace(/\.$/, '0')
          : '$' + displayPPU.toFixed(2);
        var ppuFormatted = ppuStr + (displayUnit ? ' / ' + displayUnit : '');
        ppuCell = isBest
          ? '<span class="best-value">' + ppuFormatted + '<span class="best-value-star" title="Best value">★</span></span>'
          : ppuFormatted;
      }

      var primeCell = item.isPrime
        ? '<span class="pill pill-prime">Prime</span>'
        : '<span class="na">—</span>';

      // Coupon/promo column — label only, no prices
      var couponLabel;
      if (item.hasCoupon) {
        couponLabel = '<span class="pill pill-coupon">Coupon</span>';
      } else if (item.sns) {
        couponLabel = '<span class="pill pill-coupon">S&amp;S</span>';
      } else if (item.savings) {
        couponLabel = '<span class="pill pill-coupon">' + esc(item.savings) + '</span>';
      } else if (item.couponPillOnly) {
        couponLabel = '<span class="pill pill-coupon">Check Amazon</span>';
      } else {
        couponLabel = '<span class="na">—</span>';
      }

      // Price column — two lines when coupon price available
      var priceCell;
      if (item.price != null && !isNaN(item.price)) {
        var basePrice = parseFloat(item.price);
        if (item.hasCoupon && item.listPrice && !isNaN(item.listPrice)) {
          priceCell = '$' + basePrice.toFixed(2) + ' with coupon'
            + '<br><span style="text-decoration:line-through;color:#6B5FA0;font-size:0.85em;">was $' + parseFloat(item.listPrice).toFixed(2) + '</span>';
        } else {
          priceCell = '$' + basePrice.toFixed(2);
        }
      } else {
        priceCell = '<span class="na">—</span>';
      }

      var deliveryParts = [];
      if (item.freeDate) {
        var q = item.freeQualifier ? ' <span class="na">(' + esc(item.freeQualifier) + ')</span>' : '';
        deliveryParts.push('FREE: ' + formatDeliveryDate(item.freeDate, item.freeDateTs, item.freeWindowMinutes != null ? item.freeWindowMinutes : null, item.freeWindowEnd != null ? item.freeWindowEnd : null) + q);
      }
      if (item.fastDate) {
        var fastLine = 'Fastest: ' + formatDeliveryDate(item.fastDate, item.fastDateTs, null, null);
        if (item.fastCutoff) fastLine += ' <span class="na">(order by ' + esc(item.fastCutoff) + ')</span>';
        deliveryParts.push(fastLine);
      }
      if (item.paidDate && item.paidPrice) {
        var paidLine = esc(item.paidPrice) + ' delivery ' + esc(item.paidDate);
        if (item.paidCutoff) paidLine += ' <span class="na">(order by ' + esc(item.paidCutoff) + ')</span>';
        deliveryParts.push('<span style="color:#b45309;">' + paidLine + '</span>');
      }
      var deliveryCell = deliveryParts.length ? deliveryParts.join('<br>') : '<span class="na">—</span>';

      var sourceKey = item.retailerKey || 'standard';
      var sourceCell = sourceKey === 'standard'
        ? '<span class="na">Amazon</span>'
        : '<span class="pill" style="background:#e8e4f8;color:#1A1035;border:1px solid #c1bfff;">' + esc(retailerLabel(sourceKey)) + '</span>';

      var sponsoredBadge = item.isSponsored
        ? ' <span class="pill" style="background:#f0f0f0;color:#888;border:1px solid #ddd;font-size:0.7em;">Ad</span>'
        : '';

      var thumbCell = item.imgUrl
        ? '<img src="' + esc(item.imgUrl) + '" loading="lazy" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:4px;display:block;">'
        : '';

      var noteVal = esc(item.note || '');
      var noteCell = '<textarea class="note-textarea" data-asin="' + safeAsin + '" placeholder="Add a note…" rows="2">' + noteVal + '</textarea>';

      return '<tr data-asin="' + safeAsin + '">'
        + '<td class="col-cb"><input type="checkbox" class="compare-row-cb" data-asin="' + safeAsin + '"' + (isChecked ? ' checked' : '') + '></td>'
        + '<td class="col-thumb">' + thumbCell + '</td>'
        + '<td class="col-title"><a href="' + affiliateUrl(item.asin) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>' + sponsoredBadge + '</td>'
        + '<td class="col-price">' + priceCell + '</td>'
        + '<td class="col-ppu">' + ppuCell + '</td>'
        + '<td class="col-delivery">' + deliveryCell + '</td>'
        + '<td class="col-rating">' + renderStars(item.rating) + '</td>'
        + '<td class="col-reviews">' + formatReviews(item.reviewCount) + '</td>'
        + '<td>' + primeCell + '</td>'
        + '<td>' + renderCouponCell(item) + '</td>'
        + '<td>' + sourceCell + '</td>'
        + '<td class="col-note">' + noteCell + '</td>'
        + '</tr>';
    }).join('');

    var hiddenCount = currentItems.length - items.length;
    var hiddenNote = hiddenCount > 0
      ? '<span style="color:#6B5FA0;font-size:0.88em;">' + hiddenCount + ' item' + (hiddenCount !== 1 ? 's' : '') + ' hidden by filters</span>'
      : '';

    var termBadge = searchTerm
      ? '<span class="search-term-badge">'
        + 'Amazon search: '
        + (currentSearchUrl
            ? '<a href="' + esc(currentSearchUrl) + '" target="_blank" rel="noopener" style="color:#1A1035;">' + esc(searchTerm) + '</a>'
            : esc(searchTerm))
        + '</span>'
      : '';

    var liquidToggle = '';
    if (hasAnyLiquid) {
      var opts = [
        { val: '',      label: 'As listed' },
        { val: 'fl oz', label: 'fl oz' },
        { val: 'ml',    label: 'ml' },
      ];
      liquidToggle = '<div style="margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">'
        + '<span style="font-size:0.8rem;font-weight:600;color:#1A1035;">Liquid units:</span>'
        + opts.map(function(o) {
            var active = (liquidDisplayUnit || '') === o.val;
            var style = active
              ? 'background:#512bd3;color:#ffffff;border:1px solid #512bd3;'
              : 'background:#fff;color:#1A1035;border:1px solid #DDD4EC;';
            return '<button class="liquid-unit-btn" data-unit="' + o.val + '" style="' + style + 'padding:0.2rem 0.6rem;border-radius:4px;font-size:0.8rem;cursor:pointer;font-family:inherit;">' + o.label + '</button>';
          }).join('')
        + '</div>';
    }

    return renderFilterBar(currentItems)
      + '<div id="meta-and-table">'
      + '<div class="meta-bar">'
      + '<span class="item-count">Comparing <strong>' + items.length + '</strong> item' + (items.length !== 1 ? 's' : '') + '</span>'
      + hiddenNote
      + termBadge
      + renderShareButton('top')
      + '</div>'
      + liquidToggle
      + renderActionBar()
      + renderColumnToggleBar()
      + '<div class="table-wrapper">'
      + '<table id="compare-table">'
      + '<thead><tr>' + theadCells + '</tr></thead>'
      + '<tbody>' + rows + '</tbody>'
      + '</table>'
      + '</div>'
      + '<div style="text-align:center;margin-top:1rem;">' + renderShareButton('bottom') + '</div>'
      + '<p class="affiliate-note">This post contains affiliate links. If you click through and make a purchase, I may earn a commission at no additional cost to you.</p>'
      + '</div>';
  }


  // ── Error state ───────────────────────────────────────────────
  function renderError(type) {
    if (type === 'load-failed') {
      return `
        <div class="state-box">
          <div class="icon">⚠️</div>
          <h2>Couldn't load this comparison</h2>
          <p>The link may have expired, or there was a problem reaching the server. If you still have the extension open, you can select your items again and click <strong>Compare selected items</strong> to create a new one.</p>
          <a class="btn btn-primary" href="index.html">Back to home</a>
        </div>
      `;
    }
    // Default: no data at all
    return `
      <div class="state-box">
        <div class="icon">🛒</div>
        <h2>Nothing to compare yet</h2>
        <p>This page shows your shortlisted Amazon items side by side. To use it, install the Actually Useful extension, shortlist some items while searching on Amazon, and click <strong>Compare selected items</strong>.</p>
        <a class="btn btn-primary" href="index.html">Learn more</a>
        <a class="btn btn-ghost" href="https://github.com/tibbalsgribbin/actually-useful" target="_blank">Get the extension</a>
      </div>
    `;
  }

  // ── Column sort handler ───────────────────────────────────────
  let currentItems = [];
  let checkedAsins = {}; // asin → item object
  let showCheckedOnly = false;

  // Updates action bar label and buttons in-place without re-sorting the table
  function refreshActionBarInPlace() {
    var keys = Object.keys(checkedAsins);
    var existing = document.getElementById('action-bar');
    if (keys.length === 0) {
      showCheckedOnly = false;
      if (existing) rerenderTableOnly(); // removes bar and restores all rows
    } else if (existing) {
      existing.querySelector('.action-count').textContent =
        keys.length + ' item' + (keys.length !== 1 ? 's' : '') + ' selected';
    } else {
      rerenderTableOnly(); // bar not yet in DOM — render it in
    }
  }

  function renderActionBar() {
    var keys = Object.keys(checkedAsins);
    if (!keys.length) return '';
    var label = keys.length + ' item' + (keys.length !== 1 ? 's' : '') + ' selected';
    var showLabel = showCheckedOnly ? 'Show all' : 'Show checked only';
    return '<div id="action-bar" class="visible">'
      + '<span class="action-count">' + label + '</span>'
      + '<button class="btn-action" id="action-open-tabs">Open checked in tabs</button>'
      + '<span style="font-size:0.75em;opacity:0.75;white-space:nowrap;">Your browser may ask you to allow pop-ups.</span>'
      + '<button class="btn-action-ghost" id="action-show-checked">' + showLabel + '</button>'
      + '<button class="btn-action-ghost" id="action-share-checked">Share checked items</button>'
      + '<button class="btn-action-ghost" id="action-deselect-all">Deselect all</button>'
      + '</div>';
  }

  function attachSortHandlers() {
    document.querySelectorAll('#compare-table thead th').forEach(th => {
      th.addEventListener('click', () => {
        const col = th.dataset.col;
        if (!col || th.style.cursor === 'default') return;
        if (sortCol === col) {
          sortDir = sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          sortCol = col;
          sortDir = 'asc';
        }
        rerender();
      });
    });
  }

  // Central re-render: replaces entire main-content (filter bar + table)
  function rerender() {
    const filtered = applyFilters(currentItems);
    const sorted = (sortCol && filtered.length) ? sortItems(filtered, sortCol) : filtered;
    document.getElementById('main-content').innerHTML = renderTable(sorted, currentSearchTerm);
    attachSortHandlers();
    attachFilterHandlers();
    attachLiquidToggleHandlers();
    attachColToggleHandlers();
    applyColVisibility();
    attachRowHandlers();
    attachActionBarButtons();
    attachShareHandler('top-share-btn');
    attachShareHandler('bottom-share-btn');
  }

  function attachLiquidToggleHandlers() {
    document.querySelectorAll('.liquid-unit-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var val = this.getAttribute('data-unit');
        liquidDisplayUnit = val === '' ? null : val;
        rerenderTableOnly();
      });
    });
  }

  // ── Row checkboxes, notes, and action bar ─────────────────────
  function attachRowHandlers() {
    // Individual row checkboxes
    document.querySelectorAll('.compare-row-cb').forEach(function(cb) {
      cb.addEventListener('change', function() {
        var asin = this.getAttribute('data-asin');
        var item = currentItems.find(function(it) { return it.asin === asin; });
        if (this.checked) {
          if (item) checkedAsins[asin] = item;
        } else {
          delete checkedAsins[asin];
        }
        refreshActionBarInPlace();
        // Update select-all checkbox state
        var allCbs = document.querySelectorAll('.compare-row-cb');
        var allChecked = Array.from(allCbs).every(function(c) { return c.checked; });
        var anyChecked = Array.from(allCbs).some(function(c) { return c.checked; });
        var sa = document.getElementById('compare-select-all');
        if (sa) {
          sa.checked = allChecked;
          sa.indeterminate = !allChecked && anyChecked;
        }
        if (showCheckedOnly) rerenderTableOnly();
      });
    });

    // Select-all header checkbox
    var selectAll = document.getElementById('compare-select-all');
    if (selectAll) {
      var allCbs = document.querySelectorAll('.compare-row-cb');
      var allChecked = allCbs.length > 0 && Array.from(allCbs).every(function(c) { return c.checked; });
      var anyChecked = Array.from(allCbs).some(function(c) { return c.checked; });
      selectAll.indeterminate = !allChecked && anyChecked;
      selectAll.addEventListener('change', function() {
        var check = this.checked;
        document.querySelectorAll('.compare-row-cb').forEach(function(cb) {
          cb.checked = check;
          var asin = cb.getAttribute('data-asin');
          var item = currentItems.find(function(it) { return it.asin === asin; });
          if (check) { if (item) checkedAsins[asin] = item; }
          else { delete checkedAsins[asin]; }
        });
        refreshActionBarInPlace();
        if (showCheckedOnly) rerenderTableOnly();
      });
    }

    // Editable note textareas — update currentItems in memory and try to sync to extension
    document.querySelectorAll('.note-textarea').forEach(function(ta) {
      ta.addEventListener('input', function() {
        var asin = this.getAttribute('data-asin');
        var note = this.value;
        // Update in-memory items so rerenders preserve the note
        currentItems.forEach(function(it) { if (it.asin === asin) it.note = note; });
        if (checkedAsins[asin]) checkedAsins[asin].note = note;
        // Try to sync back to extension
        if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
          try {
            chrome.runtime.sendMessage({ type: 'AU_UPDATE_NOTE', asin: asin, note: note });
          } catch(e) {}
        }
      });
      // Prevent sort-header click from interfering
      ta.addEventListener('click', function(e) { e.stopPropagation(); });
    });

    // Action bar buttons — wire once on page load, not per rerender
    // (buttons are in static HTML, not re-rendered)
  }

  // ── Action bar button handlers — wired once at init ───────────
  // Called after every render — wires buttons that live inside #meta-and-table
  function attachActionBarButtons() {
    var openTabsBtn = document.getElementById('action-open-tabs');
    if (openTabsBtn) {
      openTabsBtn.addEventListener('click', function() {
        var keys = Object.keys(checkedAsins);
        if (!keys.length) return;
        keys.forEach(function(asin, idx) {
          var item = checkedAsins[asin];
          if (!item || !item.asin) return;
          var url = 'https://www.amazon.com/dp/' + encodeURIComponent(item.asin);
          if (idx === 0) {
            window.open(url, '_blank', 'noopener');
          } else {
            setTimeout(function() {
              window.open(url, '_blank', 'noopener');
            }, idx * 150);
          }
        });
      });
    }

    var showCheckedBtn = document.getElementById('action-show-checked');
    if (showCheckedBtn) {
      showCheckedBtn.addEventListener('click', function() {
        showCheckedOnly = !showCheckedOnly;
        rerenderTableOnly();
      });
    }

    var shareCheckedBtn = document.getElementById('action-share-checked');
    if (shareCheckedBtn) {
      shareCheckedBtn.addEventListener('click', async function() {
        var keys = Object.keys(checkedAsins);
        if (!keys.length) return;
        var checkedItems = keys.map(function(a) { return checkedAsins[a]; });
        shareCheckedBtn.textContent = 'Saving…';
        try {
          var id = await saveComparison(checkedItems, currentSearchTerm);
          var shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', id);
          await navigator.clipboard.writeText(shareUrl.toString());
          shareCheckedBtn.textContent = 'Link copied!';
          setTimeout(function() { shareCheckedBtn.textContent = 'Share checked items'; }, 2500);
        } catch(e) {
          shareCheckedBtn.textContent = 'Share failed — try again';
          setTimeout(function() { shareCheckedBtn.textContent = 'Share checked items'; }, 2500);
        }
      });
    }

    var deselectBtn = document.getElementById('action-deselect-all');
    if (deselectBtn) {
      deselectBtn.addEventListener('click', function() {
        checkedAsins = {};
        showCheckedOnly = false;
        rerenderTableOnly();
      });
    }
  }

  // Stub — action bar is rendered dynamically; buttons wired by attachActionBarButtons()
  function attachActionBarHandlers() {}
  // Used by the keyword input to avoid destroying the input and dropping focus.
  function rerenderTableOnly() {
    const filtered = applyFilters(currentItems);
    const sorted = (sortCol && filtered.length) ? sortItems(filtered, sortCol) : filtered;

    var bestIndices = findBestPpuIndices(filtered);

    var liquidItems = filtered.filter(function(it) { return it.ppu && isLiquidUnit(it.ppuUnit); });
    var hasAnyLiquid = liquidItems.length > 0;

    var allChecked = sorted.length > 0 && sorted.every(function(it) { return checkedAsins[it.asin]; });
    var anyChecked = sorted.some(function(it) { return checkedAsins[it.asin]; });
    var selectAllChk = '<input type="checkbox" id="compare-select-all" title="Select all"' + (allChecked ? ' checked' : (anyChecked ? ' indeterminate-state' : '')) + '>';

    var colDefs = [
      { key: '_cb',         label: selectAllChk, nosort: true, cls: 'col-cb' },
      { key: '_thumb',      label: '',           nosort: true, cls: 'col-thumb' },
      { key: 'title',       label: 'Product' },
      { key: 'price',       label: 'Price' },
      { key: 'ppu',         label: 'Per unit' },
      { key: 'delivery',    label: 'Delivery' },
      { key: 'rating',      label: 'Rating' },
      { key: 'reviewCount', label: 'Reviews' },
      { key: 'isPrime',     label: 'Prime' },
      { key: 'coupon',      label: 'Coupon / promo' },
      { key: 'retailerKey', label: 'Source' },
      { key: 'note',        label: 'Notes' },
    ];

    var theadCells = colDefs.map(function(c) {
      var cls = c.cls || '';
      if (sortCol === c.key) cls += (cls ? ' ' : '') + (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      var style = c.nosort ? ' style="cursor:default"' : '';
      return '<th data-col="' + c.key + '" class="' + cls + '"' + style + '>' + c.label + '</th>';
    }).join('');

    var rows = sorted.map(function(item, i) {
      var isBest = bestIndices.has(i);
      var isChecked = !!checkedAsins[item.asin];
      var safeAsin = esc(item.asin);

      var ppuV = parseFloat(item.ppu);
      var ppuCell;
      if (isNaN(ppuV) || ppuV <= 0) {
        ppuCell = '<span class="na">—</span>';
      } else {
        var displayPPU = ppuV;
        var displayUnit = item.ppuUnit || '';
        if (liquidDisplayUnit && isLiquidUnit(item.ppuUnit)) {
          var converted = convertLiquidPPU(ppuV, item.ppuUnit, liquidDisplayUnit);
          if (converted != null) { displayPPU = converted; displayUnit = liquidDisplayUnit; }
        }
        var ppuStr = displayPPU < 0.10
          ? '$' + displayPPU.toFixed(3).replace(/0+$/, '').replace(/\.$/, '0')
          : '$' + displayPPU.toFixed(2);
        var ppuFormatted = ppuStr + (displayUnit ? ' / ' + displayUnit : '');
        ppuCell = isBest
          ? '<span class="best-value">' + ppuFormatted + '<span class="best-value-star" title="Best value">★</span></span>'
          : ppuFormatted;
      }

      var primeCell = item.isPrime ? '<span class="pill pill-prime">Prime</span>' : '<span class="na">—</span>';

      // Coupon/promo column — label only
      var couponLabel;
      if (item.hasCoupon) {
        couponLabel = '<span class="pill pill-coupon">Coupon</span>';
      } else if (item.sns) {
        couponLabel = '<span class="pill pill-coupon">S&amp;S</span>';
      } else if (item.savings) {
        couponLabel = '<span class="pill pill-coupon">' + esc(item.savings) + '</span>';
      } else if (item.couponPillOnly) {
        couponLabel = '<span class="pill pill-coupon">Check Amazon</span>';
      } else {
        couponLabel = '<span class="na">—</span>';
      }

      // Price column — two lines when coupon
      var priceCell;
      if (item.price != null && !isNaN(item.price)) {
        var basePrice = parseFloat(item.price);
        if (item.hasCoupon && item.listPrice && !isNaN(item.listPrice)) {
          priceCell = '$' + basePrice.toFixed(2) + ' with coupon'
            + '<br><span style="text-decoration:line-through;color:#6B5FA0;font-size:0.85em;">was $' + parseFloat(item.listPrice).toFixed(2) + '</span>';
        } else {
          priceCell = '$' + basePrice.toFixed(2);
        }
      } else {
        priceCell = '<span class="na">—</span>';
      }

      var deliveryParts = [];
      if (item.freeDate) {
        var q = item.freeQualifier ? ' <span class="na">(' + esc(item.freeQualifier) + ')</span>' : '';
        deliveryParts.push('FREE: ' + formatDeliveryDate(item.freeDate, item.freeDateTs, item.freeWindowMinutes != null ? item.freeWindowMinutes : null, item.freeWindowEnd != null ? item.freeWindowEnd : null) + q);
      }
      if (item.fastDate) {
        var fastLine = 'Fastest: ' + formatDeliveryDate(item.fastDate, item.fastDateTs, null, null);
        if (item.fastCutoff) fastLine += ' <span class="na">(order by ' + esc(item.fastCutoff) + ')</span>';
        deliveryParts.push(fastLine);
      }
      if (item.paidDate && item.paidPrice) {
        var paidLine = esc(item.paidPrice) + ' delivery ' + esc(item.paidDate);
        if (item.paidCutoff) paidLine += ' <span class="na">(order by ' + esc(item.paidCutoff) + ')</span>';
        deliveryParts.push('<span style="color:#b45309;">' + paidLine + '</span>');
      }
      var deliveryCell = deliveryParts.length ? deliveryParts.join('<br>') : '<span class="na">—</span>';

      var sourceKey = item.retailerKey || 'standard';
      var sourceCell = sourceKey === 'standard'
        ? '<span class="na">Amazon</span>'
        : '<span class="pill" style="background:#e8e4f8;color:#1A1035;border:1px solid #c1bfff;">' + esc(retailerLabel(sourceKey)) + '</span>';

      var sponsoredBadge = item.isSponsored
        ? ' <span class="pill" style="background:#f0f0f0;color:#888;border:1px solid #ddd;font-size:0.7em;">Ad</span>'
        : '';

      var thumbCell = item.imgUrl
        ? '<img src="' + esc(item.imgUrl) + '" loading="lazy" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:4px;display:block;">'
        : '';

      var noteVal = esc(item.note || '');
      var noteCell = '<textarea class="note-textarea" data-asin="' + safeAsin + '" placeholder="Add a note…" rows="2">' + noteVal + '</textarea>';

      return '<tr data-asin="' + safeAsin + '">'
        + '<td class="col-cb"><input type="checkbox" class="compare-row-cb" data-asin="' + safeAsin + '"' + (isChecked ? ' checked' : '') + '></td>'
        + '<td class="col-thumb">' + thumbCell + '</td>'
        + '<td class="col-title"><a href="' + affiliateUrl(item.asin) + '" target="_blank" rel="noopener">' + esc(item.title) + '</a>' + sponsoredBadge + '</td>'
        + '<td class="col-price">' + priceCell + '</td>'
        + '<td class="col-ppu">' + ppuCell + '</td>'
        + '<td class="col-delivery">' + deliveryCell + '</td>'
        + '<td class="col-rating">' + renderStars(item.rating) + '</td>'
        + '<td class="col-reviews">' + formatReviews(item.reviewCount) + '</td>'
        + '<td>' + primeCell + '</td>'
        + '<td>' + renderCouponCell(item) + '</td>'
        + '<td>' + sourceCell + '</td>'
        + '<td class="col-note">' + noteCell + '</td>'
        + '</tr>';
    }).join('');

    var hiddenCount = currentItems.length - filtered.length;
    var hiddenNote = hiddenCount > 0
      ? '<span style="color:#6B5FA0;font-size:0.88em;">' + hiddenCount + ' item' + (hiddenCount !== 1 ? 's' : '') + ' hidden by filters</span>'
      : '';

    var searchTerm = currentSearchTerm;
    var termBadge = searchTerm
      ? '<span class="search-term-badge">'
        + 'Amazon search: '
        + (currentSearchUrl
            ? '<a href="' + esc(currentSearchUrl) + '" target="_blank" rel="noopener" style="color:#1A1035;">' + esc(searchTerm) + '</a>'
            : esc(searchTerm))
        + '</span>'
      : '';

    var liquidToggle = '';
    if (hasAnyLiquid) {
      var opts = [
        { val: '',      label: 'As listed' },
        { val: 'fl oz', label: 'fl oz' },
        { val: 'ml',    label: 'ml' },
      ];
      liquidToggle = '<div style="margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">'
        + '<span style="font-size:0.8rem;font-weight:600;color:#1A1035;">Liquid units:</span>'
        + opts.map(function(o) {
            var active = (liquidDisplayUnit || '') === o.val;
            var style = active
              ? 'background:#512bd3;color:#ffffff;border:1px solid #512bd3;'
              : 'background:#fff;color:#1A1035;border:1px solid #DDD4EC;';
            return '<button class="liquid-unit-btn" data-unit="' + o.val + '" style="' + style + 'padding:0.2rem 0.6rem;border-radius:4px;font-size:0.8rem;cursor:pointer;font-family:inherit;">' + o.label + '</button>';
          }).join('')
        + '</div>';
    }

    var metaAndTable = document.getElementById('meta-and-table');
    if (metaAndTable) {
      metaAndTable.innerHTML = '<div class="meta-bar">'
        + '<span class="item-count">Comparing <strong>' + filtered.length + '</strong> item' + (filtered.length !== 1 ? 's' : '') + '</span>'
        + hiddenNote
        + termBadge
        + renderShareButton('top')
        + '</div>'
        + liquidToggle
        + renderActionBar()
        + renderColumnToggleBar()
        + '<div class="table-wrapper">'
        + '<table id="compare-table">'
        + '<thead><tr>' + theadCells + '</tr></thead>'
        + '<tbody>' + rows + '</tbody>'
        + '</table>'
        + '</div>'
        + '<div style="text-align:center;margin-top:1rem;">' + renderShareButton('bottom') + '</div>'
        + '<p class="affiliate-note">This post contains affiliate links. If you click through and make a purchase, I may earn a commission at no additional cost to you.</p>';
      attachSortHandlers();
      attachLiquidToggleHandlers();
      attachColToggleHandlers();
      applyColVisibility();
      attachRowHandlers();
      attachActionBarButtons();
      attachShareHandler('top-share-btn');
      attachShareHandler('bottom-share-btn');
    } else {
      // Fallback: full rerender if structure isn't in place yet
      rerender();
    }
  }

  function attachFilterHandlers() {
    // Collapse/expand toggle
    const toggle = document.getElementById('filter-bar-toggle');
    const body   = document.getElementById('filter-bar-body');
    if (toggle && body) {
      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        toggle.textContent = expanded ? '▼ Expand' : '▲ Collapse';
        body.style.display = expanded ? 'none' : '';
      });
    }

    // Include / Exclude — 250ms debounce, table-only rerender to preserve focus
    let kwTimer = null;
    const inclInput = document.getElementById('fb-include');
    if (inclInput) {
      inclInput.addEventListener('input', () => {
        clearTimeout(kwTimer);
        kwTimer = setTimeout(() => {
          filterInclude = inclInput.value;
          rerenderTableOnly();
        }, 250);
      });
    }
    const exclInput = document.getElementById('fb-exclude');
    if (exclInput) {
      exclInput.addEventListener('input', () => {
        clearTimeout(kwTimer);
        kwTimer = setTimeout(() => {
          filterExclude = exclInput.value;
          rerenderTableOnly();
        }, 250);
      });
    }

    // Min reviews
    const mrInput = document.getElementById('fb-min-reviews');
    if (mrInput) {
      mrInput.addEventListener('change', () => {
        filterMinReviews = parseInt(mrInput.value, 10) || 0;
        rerender();
      });
    }

    // Minimum rating
    const ratingInput = document.getElementById('fb-min-rating');
    if (ratingInput) {
      ratingInput.addEventListener('change', () => {
        filterMinRating = parseFloat(ratingInput.value) || 0;
        rerender();
      });
    }

    // Min price
    const minPriceInput = document.getElementById('fb-min-price');
    if (minPriceInput) {
      minPriceInput.addEventListener('change', () => {
        filterMinPrice = minPriceInput.value.trim();
        rerender();
      });
    }

    // Max price
    const maxPriceInput = document.getElementById('fb-max-price');
    if (maxPriceInput) {
      maxPriceInput.addEventListener('change', () => {
        filterMaxPrice = maxPriceInput.value.trim();
        rerender();
      });
    }

    // Retailer select
    const retSel = document.getElementById('fb-retailer');
    if (retSel) {
      retSel.addEventListener('change', () => {
        filterRetailer = retSel.value;
        rerender();
      });
    }

    // Hide sponsored toggle
    const sponChk = document.getElementById('fb-hide-sponsored');
    if (sponChk) {
      sponChk.addEventListener('change', () => {
        filterHideSponsored = sponChk.checked;
        rerender();
      });
    }

    // Require Prime toggle
    const primeChk = document.getElementById('fb-require-prime');
    if (primeChk) {
      primeChk.addEventListener('change', () => {
        filterRequirePrime = primeChk.checked;
        rerender();
      });
    }

    // Clear filters
    const clearBtn = document.getElementById('fb-clear');
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        filterInclude = '';
        filterExclude = '';
        filterMinReviews = 0;
        filterMinRating = 0;
        filterMinPrice = '';
        filterMaxPrice = '';
        filterRetailer = '';
        filterHideSponsored = false;
        filterRequirePrime = false;
        sortCol = null;
        sortDir = 'asc';
        rerender();
      });
    }
  }

  let currentSearchTerm = '';

  // ── Supabase: save comparison ─────────────────────────────────
  async function saveComparison(items, searchTerm) {
    const payload = JSON.stringify({ items, searchTerm });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Prefer': 'return=representation'
      },
      body: JSON.stringify({ data: payload })
    });
    if (!res.ok) throw new Error('Save failed: ' + res.status);
    const rows = await res.json();
    return rows[0].id;
  }

  // ── Supabase: load comparison ─────────────────────────────────
  async function loadComparison(id) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/comparisons?id=eq.${encodeURIComponent(id)}&select=data`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`
      }
    });
    if (!res.ok) throw new Error('Load failed: ' + res.status);
    const rows = await res.json();
    if (!rows || rows.length === 0) throw new Error('Not found');
    return JSON.parse(rows[0].data);
  }

  // ── Share button ──────────────────────────────────────────────
  function renderShareButton(label) {
    return `<button class="btn btn-ghost share-btn" id="${label}-share-btn">Share this comparison</button>`;
  }

  function attachShareHandler(btnId) {
    const btn = document.getElementById(btnId);
    if (!btn || btn.dataset.shareAttached) return;
    btn.dataset.shareAttached = '1';
    btn.addEventListener('click', async () => {
      btn.textContent = 'Saving…';
      try {
        // Only save to Supabase once — reuse the id if already in the URL
        let shareUrl;
        const existing = new URLSearchParams(window.location.search).get('id');
        if (existing) {
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', existing);
        } else {
          const id = await saveComparison(currentItems, currentSearchTerm);
          shareUrl = new URL(window.location.href);
          shareUrl.search = '';
          shareUrl.searchParams.set('id', id);
          window.history.replaceState(null, '', shareUrl.toString());
        }
        await navigator.clipboard.writeText(shareUrl.toString());
        // Update all share buttons — reset after 2.5s
        document.querySelectorAll('.share-btn').forEach(b => {
          b.textContent = 'Link copied!';
          b.disabled = false;
          setTimeout(() => { b.textContent = 'Share this comparison'; }, 2500);
        });
      } catch (e) {
        btn.textContent = 'Share failed — try again';
        btn.disabled = false;
        setTimeout(() => { btn.textContent = 'Share this comparison'; }, 2500);
      }
    });
  }

  // ── Bootstrap ─────────────────────────────────────────────────
  async function init() {
    const main = document.getElementById('main-content');
    const params = new URLSearchParams(window.location.search);
    const shareId = params.get('id');
    const raw = params.get('data');

    // Load from Supabase if ?id= is present
    if (shareId) {
      main.innerHTML = '<p style="text-align:center;padding:3rem;color:#6B5FA0;">Loading comparison…</p>';
      try {
        const parsed = await loadComparison(shareId);
        currentItems = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
        currentSearchUrl = parsed.searchUrl || '';
      } catch (e) {
        main.innerHTML = renderError('load-failed');
        return;
      }
      if (!currentItems.length) { main.innerHTML = renderError('load-failed'); return; }
      rerender();
      return;
    }

    // Fallback: decode ?data= for old shared links
    if (!raw) {
      main.innerHTML = renderError();
      return;
    }

    let items;
    try {
      const json = atob(decodeURIComponent(raw));
      const parsed = JSON.parse(json);
      // Accept either a bare array or { items, searchTerm }
      if (Array.isArray(parsed)) {
        items = parsed;
      } else {
        items = parsed.items || [];
        currentSearchTerm = parsed.searchTerm || '';
        currentSearchUrl = parsed.searchUrl || '';
      }
    } catch (e) {
      main.innerHTML = renderError('load-failed');
      return;
    }

    if (!items || items.length === 0) {
      main.innerHTML = renderError('load-failed');
      return;
    }

    currentItems = items;
    rerender();
  }

  init();
  attachActionBarHandlers();
</script>
